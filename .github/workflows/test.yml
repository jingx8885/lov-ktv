name: test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        run: UV_PROJECT_ENVIRONMENT="$GITHUB_WORKSPACE/.venv" uv sync --project backend --extra dev --frozen
      - name: Install ffmpeg for media pipeline tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run backend tests
        run: PYTHONPATH=backend .venv/bin/python -m pytest -q backend/tests
      - name: Check TV APK asset parity when an artifact is present
        shell: bash
        run: |
          python scripts/build-frontend-dist.py
          artifact="$(find android-tv/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -quit 2>/dev/null || true)"
          if [[ -n "$artifact" ]]; then
            python scripts/check-asset-parity.py --artifact "$artifact" --require-artifact
          else
            python scripts/check-asset-parity.py
          fi

  web:
    name: web and iOS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend types, lint and formatting
        working-directory: frontend
        run: npm ci && npm run check
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Run iOS bridge tests
        working-directory: ios
        # policy.test.mjs scans the packaged bundle, so build www first.
        run: npm ci && npm run build && npm test
