services:
  lov-ktv:
    build:
      context: .
      target: app
    image: lovktv:latest
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
    environment:
      LOVKTV_DATA: /app/data
      LOVKTV_MODELS: /opt/lovktv/models
      LOVKTV_PUBLIC_URL: ${LOVKTV_PUBLIC_URL:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_MP_APP_ID: ${WECHAT_MP_APP_ID:-}
      WECHAT_MP_APP_SECRET: ${WECHAT_MP_APP_SECRET:-}
      LOVKTV_AGENT_URL: ${LOVKTV_AGENT_URL:-}
      LOVKTV_AGENT_KEY: ${LOVKTV_AGENT_KEY:-}
      LOVKTV_AGENT_MODEL: ${LOVKTV_AGENT_MODEL:-}
      LOVKTV_ASR_MODEL: ${LOVKTV_ASR_MODEL:-grok-stt}
      LOVKTV_WHISPER_MODEL: ${LOVKTV_WHISPER_MODEL:-small}
      LOVKTV_WHISPER_COMPUTE_TYPE: ${LOVKTV_WHISPER_COMPUTE_TYPE:-int8}
      LOVKTV_APP_UPLOAD_TOKEN: ${LOVKTV_APP_UPLOAD_TOKEN:-}
      LOVKTV_ADMIN_TOKEN: ${LOVKTV_ADMIN_TOKEN:-}
      LOVKTV_ADS_OPEN: ${LOVKTV_ADS_OPEN:-}
      ALIYUN_OSS_ENABLED: ${ALIYUN_OSS_ENABLED:-}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_BUCKET_NAME: ${ALIYUN_OSS_BUCKET_NAME:-}
      ALIYUN_OSS_DOWNLOAD_DOMAIN: ${ALIYUN_OSS_DOWNLOAD_DOMAIN:-}
      LOVKTV_OSS_PREFIX: ${LOVKTV_OSS_PREFIX:-lovktv}
      LOVKTV_HTTPS_PROXY: ${LOVKTV_HTTPS_PROXY:-}
      LOVKTV_DATABASE_URL: ${LOVKTV_DATABASE_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_5: ${STRIPE_PRICE_5:-}
      STRIPE_PRICE_20: ${STRIPE_PRICE_20:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      LOVBROWSER_OIDC_ISSUER: ${LOVBROWSER_OIDC_ISSUER:-https://lovbrowser.com/api}
      LOVBROWSER_OIDC_CLIENT_ID: ${LOVBROWSER_OIDC_CLIENT_ID:-}
      LOVBROWSER_OIDC_CLIENT_SECRET: ${LOVBROWSER_OIDC_CLIENT_SECRET:-}
      LOVBROWSER_OIDC_DISCOVERY_URL: ${LOVBROWSER_OIDC_DISCOVERY_URL:-}
      LOVBROWSER_OIDC_STATE_SECRET: ${LOVBROWSER_OIDC_STATE_SECRET:-}
      LOVBROWSER_OIDC_SCOPES: ${LOVBROWSER_OIDC_SCOPES:-openid profile email}
      LOVKTV_CORS_ORIGINS: ${LOVKTV_CORS_ORIGINS:-https://ktv.lovbrowser.com,https://lovbrowser.com,https://www.lovbrowser.com}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/healthz >/dev/null && curl -fsS http://127.0.0.1:8787/api/host >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
