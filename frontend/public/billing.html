<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>选择 lov-ktv 套餐</title><link rel="stylesheet" href="/shared/ui/css/base.css"><style>body{background:#08080d;color:#fff;font-family:system-ui;padding:32px}.wrap{max-width:900px;margin:auto}.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.plan{padding:26px;border:1px solid #333;border-radius:18px;background:#15131d}.price{font-size:42px;font-weight:800}.plan button,.manage{width:100%;padding:13px;border:0;border-radius:10px;background:#ff375f;color:#fff;font-weight:700;cursor:pointer}.muted{color:#aaa}.current{padding:14px;background:#171622;border-radius:10px;margin:18px 0}</style></head><body><div class="wrap"><h1>选择你的唱歌方案</h1><p class="muted">安全跳转 Stripe，支持银行卡、Apple Pay、Google Pay。</p><div id="current" class="current">正在读取当前订阅…</div><div id="plans" class="plans"></div><p id="msg" class="muted"></p></div><script>async function load(){const r=await fetch('/api/billing/plans');const d=await r.json();document.querySelector('#plans').innerHTML=Object.entries(d.plans).map(([k,p])=>`<article class="plan"><h2>${p.name}</h2><div class="price">$${p.price}<small>/月</small></div><ul>${p.features.map(x=>`<li>${x}</li>`).join('')}</ul><button onclick="buy('${k}')">立即订阅</button></article>`).join('');const me=await fetch('/api/billing/me',{credentials:'same-origin'});if(me.ok){const x=await me.json();const quota=x.quota.unlimited?'无限':x.quota.used+' / '+x.quota.limit;const manage=x.plan==='starter'||x.plan==='pro'?'<br><button class="manage" onclick="manageSubscription()">管理订阅</button>':'';document.querySelector('#current').innerHTML='当前套餐：<b>'+x.plan+'</b> · 本月额度 '+quota+manage}else document.querySelector('#current').textContent='登录后可订阅和查看用量'}async function buy(plan){const r=await fetch('/api/billing/checkout',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({plan})});const d=await r.json();if(r.status===401){location.href='/login.html?next=/billing.html';return}if(d.url) location.href=d.url; else document.querySelector('#msg').textContent=d.detail||'暂时无法创建支付'}async function manageSubscription(){const r=await fetch('/api/billing/portal',{method:'POST',credentials:'same-origin'});const d=await r.json();if(d.url)location.href=d.url;else document.querySelector('#msg').textContent=d.detail||'无法打开管理页面'}load()</script></body></html>
