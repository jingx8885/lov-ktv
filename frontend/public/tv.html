<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lov-ktv 电视</title>
  <link rel="stylesheet" href="/app.css?v=native17" />
</head>
<body class="tv">
  <video id="mtv" muted playsinline></video>
  <canvas id="stageFx" class="stage-fx" aria-hidden="true"></canvas>
  <canvas id="partyFx" class="party-fx" aria-hidden="true"></canvas>
  <a class="qrbox" id="phoneLink" href="#">
    <div id="qr" class="qr"></div>
    <span class="qr-cap">扫码 · <b id="code"></b></span>
  </a>
  <div class="login-gate" id="loginGate" hidden>
    <div class="login-card">
      <p class="brand">lov-ktv</p>
      <h2>微信扫一下</h2>
      <p class="muted">扫码直接认号，不用点确认。</p>
      <div id="loginQr" class="qr"></div>
      <p class="tiny" id="loginHint">二维码约 3 分钟有效</p>
      <div class="row wrap-row" style="justify-content:center">
        <button class="btn primary" id="refreshLogin" type="button">刷新二维码</button>
        <button class="btn" id="skipLogin" type="button">先不登录</button>
      </div>
    </div>
  </div>
  <div class="start-gate" id="gate">
    <button class="btn primary" id="start">点击开唱</button>
  </div>
  <div class="tv-ui">
    <header class="bar">
      <div>
        <p class="brand">lov-ktv</p>
        <h2 id="title">等待点歌</h2>
        <p class="muted" id="meta"></p>
      </div>
      <div class="user-chip">
        <img class="avatar" id="tvAvatar" alt="" hidden />
        <span id="tvUser">未登录</span>
        <button class="btn" id="tvLoginBtn" type="button">登录</button>
      </div>
    </header>
    <section class="lyrics">
      <div class="lyric-plate" id="lyricPlate">
        <div class="prev" id="prev"></div>
        <div class="line" id="cur"></div>
        <div class="next" id="next"></div>
      </div>
    </section>
    <footer class="bar">
      <audio id="karaoke" crossorigin="anonymous"></audio>
      <audio id="vocal" crossorigin="anonymous" hidden></audio>
      <audio id="liveMic" autoplay playsinline hidden></audio>
      <audio id="keepAlive" loop playsinline hidden></audio>
      <p class="mic-live" id="micLive" hidden>手机麦已接入</p>
      <canvas id="bands" class="bands" width="1920" height="120" hidden></canvas>
      <div class="tv-controls">
        <button class="btn" id="skip" type="button">切歌</button>
        <button class="btn" id="toggle" type="button">原唱/伴唱</button>
      </div>
      <p class="muted" id="qinfo"></p>
    </footer>
  </div>
  <script src="/vendor/qrcode.js"></script>
  <script src="/vendor/canvas-confetti.min.js"></script>
  <script src="/bands.js?v=wave7"></script>
  <script src="/stage-fx.js?v=fx1"></script>
  <script src="/aec.js?v=aec4"></script>
  <script src="/rtc-mic.js?v=mic8"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const STATUS = {
      queued: "排队",
      fetching: "搜歌下载",
      separating: "人声分离",
      aligning: "按人声对齐歌词",
      annotating: "日语注音",
      composing: "生成 MTV",
      ready: "就绪",
      failed: "失败",
    };
    let room = null;
    let lyrics = { cues: [] };
    let lastItem = "";
    function mediaUrl(songId, name) {
      if (name === "lyrics.json") return `/media/${songId}/${name}?v=ja-kanji`;
      if (name === "karaoke.m4a" || name === "guide.m4a") return `/media/${songId}/${name}?v=stem2`;
      return `/media/${songId}/${name}`;
    }
    const prefetched = new Set();
    let prefetchBusy = 0;
    const prefetchWait = [];
    function prefetchUrl(url) {
      if (!url || prefetched.has(url)) return;
      if (prefetchBusy >= 2) {
        if (!prefetchWait.includes(url)) prefetchWait.push(url);
        return;
      }
      prefetched.add(url);
      prefetchBusy += 1;
      fetch(url, { cache: "force-cache", credentials: "same-origin" })
        .then(async (res) => {
          if (!res.ok || !res.body) {
            prefetched.delete(url);
            return;
          }
          const reader = res.body.getReader();
          while (true) {
            const step = await reader.read();
            if (step.done) break;
          }
        })
        .catch(() => { prefetched.delete(url); })
        .finally(() => {
          prefetchBusy = Math.max(0, prefetchBusy - 1);
          const next = prefetchWait.shift();
          if (next) prefetchUrl(next);
        });
    }
    function prefetchQueue(state) {
      const seen = new Set();
      const urls = [];
      const add = (songId) => {
        if (!songId || seen.has(songId)) return;
        seen.add(songId);
        urls.push(mediaUrl(songId, "karaoke.m4a"));
        urls.push(mediaUrl(songId, "mtv.mp4"));
        urls.push(mediaUrl(songId, "original.mp3"));
        urls.push(mediaUrl(songId, "lyrics.json"));
        urls.push(`/media/${songId}/skeleton.json`);
      };
      const now = state && state.now_playing;
      if (now && now.status === "ready") add(now.song_id);
      ((state && state.queue) || []).forEach((item) => {
        if (item && item.status === "ready") add(item.song_id);
      });
      urls.slice(0, 12).forEach(prefetchUrl);
    }
    function micGainValue() {
      const hostMac = room && room.host_volume_kind === "mac";
      const vol = hostMac ? 1 : (((room && room.volume) != null ? room.volume : 80) / 100);
      const micGain = ((room && room.mic_gain) != null ? room.mic_gain : 80) / 100;
      return Math.max(0, Math.min(1, vol * micGain));
    }
    let armed = false;
    const tabId = Math.random().toString(36).slice(2);
    const audioBus = "BroadcastChannel" in window ? new BroadcastChannel("lovktv-audio") : null;
    let isLeader = true;
    let lastLyricsAt = 0;
    const lyricPaint = { prev: "", cur: "", next: "" };
    let audioHook = null;
    let stageFx = null;
    let lastFxCue = -1;
    let lastCelebrateAt = 0;
    let hookLines = new Set();
    let roomRtc = null;
    let lastMtvSeek = 0;
    let lastVocalSync = 0;
    let boundMtvSong = "";
    let skeleton = null;

    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function tokenProgress(tok, t) {
      if (t >= tok.end_ms) return 100;
      if (t >= tok.start_ms) return ((t - tok.start_ms) / Math.max(tok.end_ms - tok.start_ms, 1)) * 100;
      return 0;
    }
    function cueKey(cue) {
      return cue ? `${cue.start_ms}:${cue.end_ms}:${cue.text}` : "";
    }
    function paintLine(el, cue, t, slot) {
      if (!el) return;
      if (!cue) {
        if (lyricPaint[slot] !== "empty") {
          el.innerHTML = "";
          lyricPaint[slot] = "empty";
        }
        return;
      }
      const skin = t < 0 ? "wait" : t > 1e10 ? "done" : "live";
      const id = cueKey(cue) + ":" + skin;
      if (lyricPaint[slot] !== id) {
        el.innerHTML = renderCue(cue, t);
        lyricPaint[slot] = id;
        return;
      }
      if (skin !== "live") return;
      const toks = cue.tokens || [];
      el.querySelectorAll(".rb").forEach((node, i) => {
        if (!toks[i]) return;
        const next = Math.round(tokenProgress(toks[i], t)) + "%";
        if (node.style.getPropertyValue("--p") !== next) node.style.setProperty("--p", next);
      });
    }
    function renderCue(cue, t) {
      const tokens = cue.tokens || [];
      if (!tokens.length) return escapeHtml(cue.text);
      return tokens.map((tok, i) => {
        const p = Math.round(tokenProgress(tok, t));
        const body = `<span class="rb" style="--p:${p}%">${escapeHtml(tok.text)}</span>`;
        const reading = tok.reading && tok.reading !== tok.text ? String(tok.reading) : "";
        const rt = `<span class="rt">${[...reading].map((ch) => `<i>${escapeHtml(ch)}</i>`).join("")}</span>`;
        const roma = tok.romaji && tok.romaji !== tok.text ? String(tok.romaji) : "";
        const romaHtml = roma ? `<span class="roma">${escapeHtml(roma)}</span>` : `<span class="roma"></span>`;
        const latin = /^[A-Za-z0-9']/.test(tok.text || "");
        const next = tokens[i + 1];
        const space = latin && next && !/^[.,!?;:'")\]]/.test(next.text || "")
          ? `<span class="tok-space"> </span>`
          : "";
        return `<span class="tok${latin ? " latin" : ""}"><span class="anno">${rt}${body}${romaHtml}</span></span>${space}`;
      }).join("");
    }

    function renderQr(url, target) {
      const box = $(target || "qr");
      box.innerHTML = "";
      if (typeof qrcode === "function") {
        const qr = qrcode(0, "M");
        qr.addData(url);
        qr.make();
        box.innerHTML = qr.createSvgTag(5, 0);
        return;
      }
      box.textContent = url;
    }

    function roomCode() {
      return (new URLSearchParams(location.search).get("room") || localStorage.getItem("tvRoom") || "").toUpperCase();
    }

    async function hostOrigin() {
      try {
        const data = await fetch("/api/host").then((r) => r.json());
        if (data && data.origin) return String(data.origin).replace(/\/$/, "");
      } catch (err) {}
      return location.origin;
    }

    let loginTicket = "";
    let loginTimer = 0;

    function renderUserChip(user) {
      $("tvUser").textContent = user ? (user.sid || user.nickname || "已登录") : "未登录";
      $("tvLoginBtn").textContent = user ? "换账号" : "登录";
      if (user && user.avatar) {
        $("tvAvatar").hidden = false;
        $("tvAvatar").src = user.avatar;
      } else {
        $("tvAvatar").hidden = true;
      }
    }

    async function currentUser() {
      const data = await fetch("/api/auth/me", { credentials: "same-origin" }).then((r) => r.json()).catch(() => ({ user: null }));
      return data.user;
    }

    async function startLoginQr() {
      $("loginGate").hidden = false;
      $("loginHint").textContent = "正在生成二维码…";
      const res = await fetch("/api/auth/qr", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room: room ? room.code : roomCode() }),
      });
      const data = await res.json();
      loginTicket = data.ticket;
      renderQr(data.url, "loginQr");
      $("loginHint").textContent = "微信扫一下就行，约 3 分钟有效";
      if (loginTimer) clearInterval(loginTimer);
      loginTimer = setInterval(pollLogin, 2000);
    }

    async function pollLogin() {
      if (!loginTicket) return;
      const res = await fetch("/api/auth/qr/" + loginTicket + "?claim=1", { credentials: "same-origin" });
      if (!res.ok) return;
      const data = await res.json();
      if (data.status === "expired") {
        $("loginHint").textContent = "二维码过期了，点刷新";
        return;
      }
      if (data.status === "ok" && data.user) {
        clearInterval(loginTimer);
        loginTicket = "";
        $("loginGate").hidden = true;
        renderUserChip(data.user);
      }
    }

    async function boot() {
      if (/LovKtvAndroidTV/i.test(navigator.userAgent || "") || new URLSearchParams(location.search).get("androidtv")) {
        document.body.classList.add("androidtv");
      }
      const wanted = roomCode();
      room = wanted
        ? await fetch("/api/rooms/" + wanted).then((r) => r.json())
        : await fetch("/api/rooms", { method: "POST" }).then((r) => r.json());
      localStorage.setItem("tvRoom", room.code);
      $("code").textContent = room.code;
      const url = (await hostOrigin()) + "/m.html?room=" + room.code + "&v=queue3";
      $("phoneLink").href = url;
      renderQr(url);
      const user = await currentUser();
      renderUserChip(user);
      sessionStorage.setItem("tvSkipLogin", "1");
      $("loginGate").hidden = true;
      $("tvLoginBtn").onclick = () => startLoginQr();
      $("refreshLogin").onclick = () => startLoginQr();
      $("skipLogin").onclick = () => {
        sessionStorage.setItem("tvSkipLogin", "1");
        $("loginGate").hidden = true;
        if (loginTimer) clearInterval(loginTimer);
      };
      bindRoomRtc(room.code);
      tick();
      setInterval(tick, 1500);
      requestAnimationFrame(paint);
    }

    function roomLine(state) {
      const mix = Math.round(((state && state.vocal_mix) || 0) * 100);
      const vol = (state && state.volume != null) ? state.volume : 80;
      const mic = state && state.mic_on ? " · 手机麦开" : "";
      return `队列 ${((state && state.queue) || []).length} · 原唱 ${mix}% · 音量 ${vol}%${mic}`;
    }

    let pendingMic = null;
    function playRawMic(stream) {
      const el = $("liveMic");
      if (!el || !stream) return;
      if (el.srcObject !== stream) el.srcObject = stream;
      el.muted = false;
      el.volume = micGainValue();
      el.play().catch(() => {});
    }
    async function bindLiveMic(stream) {
      pendingMic = stream;
      playRawMic(stream);
      applyMix();
      if (!window.LovAec) return;
      try {
        await LovAec.ensureCtx();
        const ctx = LovAec.getCtx();
        if (ctx && ctx.state === "suspended") await ctx.resume();
        const ok = await LovAec.attach(stream, {
          karaoke: $("karaoke"),
          vocal: $("vocal"),
          hook: audioHook,
          gain: micGainValue(),
        });
        applyMix();
        if (!ok) playRawMic(stream);
      } catch (err) {
        playRawMic(stream);
      }
    }

    function clearLiveMic() {
      pendingMic = null;
      if (window.LovAec) LovAec.detach();
      const el = $("liveMic");
      el.pause();
      el.srcObject = null;
      $("micLive").hidden = true;
    }

    function bindRoomRtc(code) {
      if (!window.LovMic || !code) return;
      if (roomRtc) return;
      roomRtc = LovMic.create({ role: "tv" });
      roomRtc.connect(code, {
        onSnapshot: (snap) => {
          if (!snap) return;
          room = snap;
          prefetchQueue(snap);
          applyMix();
          const now = snap.now_playing;
          if (now && now.status === "ready") {
            if (lastItem !== (now.id || now.song_id)) tick();
            else if (pageVisible() && isLeader) {
              const karaoke = $("karaoke");
              if (karaoke && karaoke.paused) startPlayback();
            }
          }
        },
        onRtc: (msg) => {
          if (msg.kind === "offer") roomRtc.handleOffer(msg);
          else if (msg.kind === "ice") roomRtc.addIce(msg);
          else if (msg.kind === "hangup") {
            roomRtc.resetPc();
            clearLiveMic();
            if (room) room.mic_on = false;
            applyMix();
          }
        },
        onStream: bindLiveMic,
      });
    }

    let audioUnlocked = false;
    let keepAliveTimer = 0;
    let keepAliveSrc = "";
    let keepAliveTone = null;
    let playRetryTimer = 0;

    function makeQuietLoop() {
      const sr = 44100;
      const n = Math.floor(sr * 0.5);
      const dataSize = n * 2;
      const buf = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buf);
      const write = (offset, text) => {
        for (let i = 0; i < text.length; i += 1) view.setUint8(offset + i, text.charCodeAt(i));
      };
      write(0, "RIFF");
      view.setUint32(4, 36 + dataSize, true);
      write(8, "WAVE");
      write(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sr, true);
      view.setUint32(28, sr * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      write(36, "data");
      view.setUint32(40, dataSize, true);
      for (let i = 0; i < n; i += 1) {
        view.setInt16(44 + i * 2, Math.sin((2 * Math.PI * 17000 * i) / sr) * 900, true);
      }
      return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
    }

    function liveCtxs() {
      const out = [];
      const aec = window.LovAec && LovAec.getCtx();
      if (aec) out.push(aec);
      if (audioHook && audioHook.ctx && out.indexOf(audioHook.ctx) < 0) out.push(audioHook.ctx);
      return out;
    }

    function resumeCtxs() {
      return Promise.all(liveCtxs().map((ctx) => (
        ctx.state === "suspended" ? ctx.resume().catch(() => {}) : Promise.resolve()
      )));
    }

    function startKeepAliveTone() {
      const ctx = liveCtxs()[0];
      if (!ctx || keepAliveTone) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 20;
        gain.gain.value = 0.00003;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        keepAliveTone = { osc, gain };
      } catch (_) {}
    }

    function pumpKeepAlive() {
      const el = $("keepAlive");
      if (el) {
        if (!keepAliveSrc) keepAliveSrc = makeQuietLoop();
        if (!el.getAttribute("src")) {
          el.src = keepAliveSrc;
          el.loop = true;
          el.muted = false;
          el.volume = 0.04;
        }
        if (el.paused) el.play().catch(() => {});
      }
      resumeCtxs();
      startKeepAliveTone();
    }

    function startKeepAlive() {
      pumpKeepAlive();
      if (keepAliveTimer) return;
      keepAliveTimer = setInterval(() => {
        if (!audioUnlocked) return;
        pumpKeepAlive();
        const now = room && room.now_playing;
        const karaoke = $("karaoke");
        if (now && now.status === "ready" && karaoke && karaoke.paused && pageVisible() && isLeader) {
          startPlayback();
        }
      }, 1500);
    }

    function schedulePlayRetries() {
      if (playRetryTimer) return;
      const delays = [250, 600, 1200, 2500, 5000];
      let n = 0;
      const step = () => {
        const now = room && room.now_playing;
        const karaoke = $("karaoke");
        if (!now || now.status !== "ready") {
          playRetryTimer = 0;
          return;
        }
        if (karaoke && !karaoke.paused && karaoke.getAttribute("src")) {
          $("gate").hidden = true;
          playRetryTimer = 0;
          return;
        }
        if (pageVisible() && isLeader) startPlayback();
        if (n < delays.length) {
          playRetryTimer = setTimeout(step, delays[n]);
          n += 1;
        } else {
          playRetryTimer = 0;
          if (karaoke && karaoke.paused) $("gate").hidden = false;
        }
      };
      playRetryTimer = setTimeout(step, delays[n]);
      n += 1;
    }

    function playEl(el) {
      if (!el) return Promise.resolve();
      startKeepAlive();
      return resumeCtxs()
        .then(() => {
          const keep = $("keepAlive");
          return keep && keep.paused ? keep.play().catch(() => {}) : null;
        })
        .then(() => el.play())
        .catch(() => resumeCtxs().then(() => el.play()));
    }
    function hookAudio() {
      if (audioHook && audioHook.ctx) {
        if (audioHook.ctx.state === "suspended") audioHook.ctx.resume().catch(() => {});
        if (window.LovAec) LovAec.retap(audioHook);
        return;
      }
      if (!audioUnlocked) return;
      const shared = window.LovAec && LovAec.getCtx();
      audioHook = LovBands.hookAnalyser($("karaoke"), audioHook, shared ? { ctx: shared } : null);
      if (window.LovAec) LovAec.retap(audioHook);
    }
    function unlockAudio() {
      audioUnlocked = true;
      startKeepAlive();
      if (window.LovAec) {
        LovAec.ensureCtx().then(() => {
          hookAudio();
          if (pendingMic) bindLiveMic(pendingMic);
        });
        return;
      }
      hookAudio();
    }

    function ensureStageFx() {
      if (stageFx || !window.LovStageFx) return stageFx;
      stageFx = LovStageFx.create($("stageFx"));
      LovStageFx.bindParty($("partyFx"));
      return stageFx;
    }

    function liveBeat() {
      if (!audioHook) return 0;
      const freq = audioHook.freq;
      const wave = audioHook.time;
      let peak = 0;
      let sum = 0;
      if (wave && wave.length) {
        const step = Math.max(1, Math.floor(wave.length / 160));
        for (let i = 0; i < wave.length; i += step) {
          const v = (wave[i] - 128) / 128;
          sum += v * v;
          peak = Math.max(peak, Math.abs(v));
        }
        const rms = Math.sqrt(sum / Math.max(1, Math.floor(wave.length / step)));
        return Math.max(0, Math.min(1, rms * 0.7 + peak * 0.5));
      }
      if (freq && freq.length) {
        for (let i = 2; i < Math.min(48, freq.length); i += 1) sum += freq[i];
        return Math.max(0, Math.min(1, (sum / 46) / 255));
      }
      return 0;
    }

    function fireCueFx(cue, idx) {
      if (nativeMv() || !cue || idx < 0 || idx === lastFxCue) return;
      lastFxCue = idx;
      const fx = ensureStageFx();
      if (fx) fx.spawn();
      const text = String(cue.text || "").trim();
      const now = Date.now();
      if (text && hookLines.has(text) && now - lastCelebrateAt > 8000) {
        lastCelebrateAt = now;
        LovStageFx.celebrate(idx % 2 ? "side" : "center");
      }
    }

    function silenceMtv(mtv) {
      mtv.muted = true;
      mtv.defaultMuted = true;
      mtv.volume = 0;
    }

    function nativeMv() {
      return !!(
        (skeleton && skeleton.has_video)
        || (lyrics && lyrics.native_video === true)
      );
    }

    function syncNativeMv() {
      const on = nativeMv();
      document.body.classList.toggle("has-native-mv", on);
      const plate = $("lyricPlate");
      if (!plate) return;
      plate.classList.toggle("bare", on);
      ["background", "backgroundImage", "border", "borderRadius", "boxShadow", "backdropFilter", "webkitBackdropFilter", "padding"].forEach((key) => {
        plate.style[key] = "";
      });
      if (on) {
        plate.style.background = "transparent";
        plate.style.backgroundImage = "none";
        plate.style.border = "0";
        plate.style.borderRadius = "0";
        plate.style.boxShadow = "none";
        plate.style.backdropFilter = "none";
        plate.style.webkitBackdropFilter = "none";
        plate.style.padding = "0 12px 4px";
      }
      if (!on) ensureStageFx();
    }

    function lyricsFingerprint(data) {
      const cues = (data && data.cues) || [];
      if (!cues.length) return "0";
      const first = cues[0];
      const last = cues[cues.length - 1];
      return [cues.length, first.start_ms, first.text, last.start_ms, last.text].join("|");
    }

    function bindMtv(songId) {
      const mtv = $("mtv");
      if (!songId) return;
      if (boundMtvSong === songId && (mtv.getAttribute("src") || mtv.src)) return;
      boundMtvSong = songId;
      syncNativeMv();
      silenceMtv(mtv);
      mtv.onerror = () => {
        if (document.body.classList.contains("has-mtv")) return;
        mtv.hidden = true;
        document.body.classList.remove("has-mtv", "has-native-mv");
        boundMtvSong = "";
      };
      mtv.onloadeddata = () => {
        silenceMtv(mtv);
        mtv.hidden = false;
        document.body.classList.add("has-mtv");
        syncNativeMv();
        if (canPlay()) mtv.play().catch(() => {});
      };
      mtv.src = mediaUrl(songId, "mtv.mp4");
      silenceMtv(mtv);
    }

    async function tick() {
      const code = roomCode() || (room && room.code);
      if (!code) return;
      room = await fetch("/api/rooms/" + code).then((r) => r.json());
      localStorage.setItem("tvRoom", room.code);
      prefetchQueue(room);
      const now = room.now_playing;
      $("qinfo").textContent = roomLine(room);
      if (!now) {
        stopPlayback();
        $("gate").hidden = true;
        $("title").textContent = "";
        $("meta").textContent = "";
        $("prev").innerHTML = "";
        $("cur").textContent = "";
        $("next").innerHTML = "";
        return;
      }
      $("title").textContent = now.title;
      $("meta").textContent = `${now.artist || ""} · ${STATUS[now.status] || now.status}`;
      if (now.status !== "ready") {
        $("prev").innerHTML = "";
        $("cur").textContent = "";
        $("next").textContent = "";
        return;
      }
      const itemKey = now.id || now.song_id;
      if (lastItem !== itemKey) {
        lastItem = itemKey;
        lyricPaint.prev = "";
        lyricPaint.cur = "";
        lyricPaint.next = "";
        lyrics = await fetch(`/media/${now.song_id}/lyrics.json?v=ja-kanji&t=${Date.now()}`).then((r) => r.ok ? r.json() : { cues: [] });
        skeleton = await fetch(`/media/${now.song_id}/skeleton.json`).then((r) => r.ok ? r.json() : null).catch(() => null);
        lastLyricsAt = Date.now();
        lastFxCue = -1;
        lastMtvSeek = 0;
        lastVocalSync = 0;
        boundMtvSong = "";
        syncNativeMv();
        hookLines = nativeMv() ? new Set() : (window.LovStageFx ? LovStageFx.hookTexts(lyrics.cues) : new Set());
        if (!nativeMv()) ensureStageFx();
        bindMtv(now.song_id);
        startPlayback();
      } else {
        applyMix();
        if (!document.body.classList.contains("has-mtv") && !$("mtv").getAttribute("src")) {
          bindMtv(now.song_id);
        }
        if (Date.now() - lastLyricsAt > 8000) {
          lastLyricsAt = Date.now();
          const prev = lyricsFingerprint(lyrics);
          fetch(`/media/${now.song_id}/lyrics.json?v=ja-kanji&t=${lastLyricsAt}`)
            .then((r) => r.ok ? r.json() : null)
            .then((data) => {
              if (!data || !data.cues || lyricsFingerprint(data) === prev) return;
              lyrics = data;
            })
            .catch(() => {});
        }
        const karaoke = $("karaoke");
        if (pageVisible() && isLeader && karaoke && (karaoke.paused || !karaoke.getAttribute("src"))) {
          startPlayback();
        }
      }
    }

    function stopAudioOnly() {
      ["karaoke", "vocal"].forEach((id) => {
        const el = $(id);
        el.pause();
        el.removeAttribute("src");
        el.load();
      });
      $("mtv").pause();
    }

    function stopPlayback() {
      lyrics = { cues: [] };
      skeleton = null;
      lastItem = "";
      lyricPaint.prev = "";
      lyricPaint.cur = "";
      lyricPaint.next = "";
      ["karaoke", "vocal", "mtv"].forEach((id) => {
        const el = $(id);
        el.pause();
        el.removeAttribute("src");
        el.load();
      });
      $("mtv").hidden = true;
      boundMtvSong = "";
      document.body.classList.remove("has-mtv", "has-native-mv");
      lastFxCue = -1;
      hookLines = new Set();
      if (stageFx) stageFx.clear();
    }

    function paint() {
      const now = room && room.now_playing;
      if (now && now.status === "ready") {
        const karaoke = $("karaoke");
        const mtv = $("mtv");
        silenceMtv(mtv);
        const t = Math.floor((karaoke.currentTime || 0) * 1000);
        syncVocal();
        const audioLive = !karaoke.paused && karaoke.readyState >= 2 && karaoke.currentTime > 0.05;
        if (!mtv.hidden && mtv.src && Number.isFinite(mtv.duration) && mtv.readyState >= 2 && !mtv.seeking && !karaoke.seeking) {
          const target = Math.min(karaoke.currentTime || 0, Math.max(0, mtv.duration - 0.05));
          if (audioLive && Math.abs(mtv.currentTime - target) > 2 && Date.now() - lastMtvSeek > 1500) {
            lastMtvSeek = Date.now();
            try { mtv.currentTime = target; } catch (err) {}
          }
          if (karaoke.paused) mtv.pause();
          else if (audioLive && mtv.paused && !mtv.ended) mtv.play().catch(() => {});
        }
        const cues = lyrics.cues || [];
        const idx = cues.findIndex((c) => t >= c.start_ms && t < c.end_ms);
        const cue = idx >= 0 ? cues[idx] : null;
        const upcomingIdx = cues.findIndex((c) => t < c.start_ms);
        if (cue) {
          fireCueFx(cue, idx);
          paintLine($("prev"), idx > 0 ? cues[idx - 1] : null, 1e12, "prev");
          paintLine($("cur"), cue, t, "cur");
          paintLine($("next"), cues[idx + 1] || null, -1, "next");
        } else if (upcomingIdx >= 0) {
          const held = upcomingIdx > 0 ? cues[upcomingIdx - 1] : null;
          paintLine($("prev"), upcomingIdx > 1 ? cues[upcomingIdx - 2] : null, 1e12, "prev");
          paintLine($("cur"), held, 1e12, "cur");
          paintLine($("next"), cues[upcomingIdx], -1, "next");
        } else {
          paintLine($("prev"), cues.length ? cues[cues.length - 1] : null, 1e12, "prev");
          paintLine($("cur"), null, t, "cur");
          paintLine($("next"), null, -1, "next");
        }
      }
      if (audioHook && !nativeMv()) LovBands.pull(audioHook);
      if (stageFx && !nativeMv()) {
        stageFx.draw({
          beat: now && now.status === "ready" ? liveBeat() : 0,
          now: performance.now() / 1000,
        });
      }
      requestAnimationFrame(paint);
    }

    function claimLeader() {
      if (isLeader) return;
      isLeader = true;
      if (audioBus) audioBus.postMessage({ type: "claim", tabId });
    }

    function pauseAudio() {
      ["karaoke", "vocal", "mtv"].forEach((id) => $(id).pause());
    }

    function syncVocal(forceTime) {
      const karaoke = $("karaoke");
      const vocal = $("vocal");
      const mix = room && room.vocal_mix != null ? room.vocal_mix : 1;
      if (!vocal || !vocal.getAttribute("src")) return;
      if (mix <= 0.01 && forceTime == null) {
        if (!vocal.paused) vocal.pause();
        return;
      }
      if (vocal.readyState < 1) return;
      const t = forceTime != null ? forceTime : (karaoke.currentTime || 0);
      const now = Date.now();
      if (forceTime == null && now - lastVocalSync < 400) return;
      lastVocalSync = now;
      try {
        if (Math.abs((vocal.currentTime || 0) - t) > 0.35) vocal.currentTime = t;
      } catch (err) {}
      if (karaoke && !karaoke.paused && karaoke.src) {
        vocal.play().catch(() => {});
      } else {
        vocal.pause();
      }
    }

    function applyMix() {
      const mix = room && room.vocal_mix != null ? room.vocal_mix : 1;
      const hostMac = room && room.host_volume_kind === "mac";
      const vol = hostMac ? 1 : (((room && room.volume) != null ? room.volume : 80) / 100);
      const micGain = ((room && room.mic_gain) != null ? room.mic_gain : 80) / 100;
      const karaoke = $("karaoke");
      const vocal = $("vocal");
      const live = $("liveMic");
      karaoke.muted = mix >= 0.99;
      vocal.muted = mix <= 0.01;
      karaoke.volume = karaoke.muted ? 0 : vol * (1 - mix);
      vocal.volume = vocal.muted ? 0 : vol * mix;
      const g = Math.max(0, Math.min(1, vol * micGain));
      const filtered = !!(window.LovAec && LovAec.isActive());
      if (filtered) LovAec.setGain(g);
      if (live) {
        live.muted = filtered;
        live.volume = filtered ? 0 : g;
        if (!filtered && live.srcObject && live.paused) live.play().catch(() => {});
      }
      $("micLive").hidden = !(room && room.mic_on) && !pendingMic;
      $("qinfo").textContent = roomLine(room);
    }

    function pageVisible() {
      return document.visibilityState === "visible";
    }

    function canPlay() {
      return armed && pageVisible() && isLeader;
    }

    function startPlayback() {
      if (!pageVisible()) {
        pauseAudio();
        $("gate").hidden = false;
        return;
      }
      armed = true;
      claimLeader();
      if (!isLeader) return;
      const songId = room && room.now_playing && room.now_playing.song_id;
      if (!songId) return;
      const karaoke = $("karaoke");
      const vocal = $("vocal");
      const playingSrc = String(karaoke.getAttribute("src") || karaoke.src || "");
      const sameSong = playingSrc.includes(songId);
      if (sameSong) {
        applyMix();
        silenceMtv($("mtv"));
        if (karaoke.paused) {
          playEl(karaoke).then(() => { $("gate").hidden = true; }).catch(() => {
            if (audioUnlocked) schedulePlayRetries();
            else $("gate").hidden = false;
          });
        } else {
          $("gate").hidden = true;
        }
        if (vocal.paused) playEl(vocal).catch(() => {});
        const mtv = $("mtv");
        if (mtv && mtv.paused && karaoke.currentTime > 0.05) playEl(mtv).catch(() => {});
        return;
      }
      karaoke.src = mediaUrl(songId, "karaoke.m4a");
      karaoke.onerror = () => { karaoke.src = mediaUrl(songId, "original.mp3"); };
      vocal.src = mediaUrl(songId, "original.mp3");
      vocal.onerror = () => { vocal.src = mediaUrl(songId, "guide.m4a"); };
      applyMix();
      silenceMtv($("mtv"));
      if (audioUnlocked) hookAudio();
      const fx = ensureStageFx();
      if (fx && lastFxCue < 0) fx.spawn();
      const ready = () => {
        syncVocal(karaoke.currentTime || 0);
      };
      karaoke.onloadedmetadata = ready;
      vocal.onloadedmetadata = ready;
      playEl(karaoke).then(() => { $("gate").hidden = true; }).catch(() => {
        if (audioUnlocked) schedulePlayRetries();
        else $("gate").hidden = false;
      });
      playEl(vocal).catch(() => {});
      playEl($("mtv")).catch(() => {});
    }

    if (audioBus) {
      audioBus.onmessage = (event) => {
        if (event.data && event.data.type === "claim" && event.data.tabId !== tabId && isLeader) {
          isLeader = false;
          pauseAudio();
        }
      };
    }
    document.addEventListener("visibilitychange", () => {
      if (!pageVisible()) {
        pauseAudio();
        return;
      }
      if (armed && room && room.now_playing) startPlayback();
    });

    $("start").onclick = () => {
      unlockAudio();
      startPlayback();
    };
    document.addEventListener("pointerdown", () => {
      unlockAudio();
      const karaoke = $("karaoke");
      if (room && room.now_playing && room.now_playing.status === "ready" && karaoke && karaoke.paused) {
        startPlayback();
      }
    });
    document.addEventListener("keydown", () => {
      unlockAudio();
      const karaoke = $("karaoke");
      if (room && room.now_playing && room.now_playing.status === "ready" && karaoke && karaoke.paused) {
        startPlayback();
      }
    });
    $("skip").onclick = async () => {
      const code = roomCode() || (room && room.code);
      if (!code) return;
      $("skip").disabled = true;
      try {
        room = await fetch("/api/rooms/" + code + "/skip", { method: "POST" }).then((r) => r.json());
        if (!room.now_playing) stopPlayback();
        else lastItem = "";
        if (room.now_playing) $("title").textContent = room.now_playing.title;
        await tick();
      } finally {
        $("skip").disabled = false;
      }
    };
    $("toggle").onclick = async () => {
      const next = (room.vocal_mix || 0) > 0.5 ? 0 : 1;
      room = await fetch("/api/rooms/" + (roomCode() || room.code) + "/mix", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vocal_mix: next }),
      }).then((r) => r.json());
      applyMix();
    };
    $("karaoke").addEventListener("ended", () => $("skip").click());
    boot();
  </script>
</body>
</html>
