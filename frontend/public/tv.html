<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n-title="tv.title">lov-ktv 电视</title>
  <link rel="icon" href="/brand/icon.png" type="image/png" />
  <link rel="icon" href="/brand/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/brand/apple-touch.png" />
  <link rel="stylesheet" href="/shared/ui/css/tokens.css" />
  <link rel="stylesheet" href="/shared/ui/css/base.css" />
  <link rel="stylesheet" href="/shared/lyrics/css/lyrics.css" />
  <link rel="stylesheet" href="/tv/stage/css/stage.css" />
  <link rel="stylesheet" href="/tv/lyrics/css/lyrics.css" />
  <link rel="stylesheet" href="/tv/gates/css/gates.css" />
</head>
<body class="tv is-waiting">
  <img id="waitArt" class="wait-art" src="/brand/wait-tv.jpg" alt="" />
  <video id="mtv" muted playsinline></video>
  <canvas id="stageFx" class="stage-fx" aria-hidden="true"></canvas>
  <canvas id="partyFx" class="party-fx" aria-hidden="true"></canvas>
  <div class="qrbox">
    <a id="phoneLink" href="#">
      <div id="qr" class="qr"></div>
      <span class="qr-cap"><span data-i18n="tv.scan">扫码 · </span><b id="code"></b></span>
    </a>
    <p class="remote-hint" id="remoteHint" hidden>确认 原唱/伴唱 · 右键切歌 · 上下音量</p>
  </div>
  <div class="login-gate" id="loginGate" hidden>
    <div class="login-card">
      <p class="brand"><img class="brand-mark" src="/brand/icon.png" width="28" height="28" alt="">lov-ktv</p>
      <h2 data-i18n="tv.loginTitle">微信扫一下</h2>
      <p class="muted" data-i18n="tv.loginLead">扫码直接认号，不用点确认。</p>
      <div id="loginQr" class="qr"></div>
      <p class="tiny" id="loginHint" data-i18n="tv.loginHint">二维码约 3 分钟有效</p>
      <div class="row wrap-row" style="justify-content:center">
        <button class="btn primary" id="refreshLogin" type="button" data-i18n="tv.refreshQr">刷新二维码</button>
        <button class="btn" id="skipLogin" type="button" data-i18n="tv.skipLogin">先不登录</button>
      </div>
    </div>
  </div>
  <div class="start-gate" id="gate">
    <button class="btn primary" id="start" data-i18n="tv.start">点击开唱</button>
  </div>
  <div class="tv-ui">
    <header class="bar">
      <div>
        <p class="brand"><img class="brand-mark" src="/brand/icon.png" width="28" height="28" alt="">lov-ktv</p>
        <h2 id="title">等待点歌</h2>
        <p class="muted" id="meta"></p>
      </div>
      <div class="user-chip">
        <img class="avatar" id="tvAvatar" alt="" hidden />
        <span id="tvUser" data-i18n="tv.out">未登录</span>
        <button class="btn" id="tvLoginBtn" type="button" data-i18n="tv.login">登录</button>
      </div>
    </header>
    <section class="lyrics">
      <div class="lyric-plate" id="lyricPlate">
        <div class="prev" id="prev"></div>
        <div class="line" id="cur"></div>
        <div class="next" id="next"></div>
      </div>
    </section>
    <footer class="bar">
      <audio id="karaoke" crossorigin="anonymous"></audio>
      <audio id="vocal" crossorigin="anonymous" hidden></audio>
      <audio id="liveMic" autoplay playsinline hidden></audio>
      <audio id="keepAlive" loop playsinline hidden></audio>
      <p class="mic-live" id="micLive" hidden data-i18n="tv.micLive">手机麦已接入</p>
      <canvas id="bands" class="bands" width="1920" height="120" hidden></canvas>
      <div class="tv-controls">
        <button class="btn" id="skip" type="button" data-i18n="common.skip">切歌</button>
        <button class="btn" id="toggle" type="button" data-i18n="tv.toggle">原唱/伴唱</button>
      </div>
      <p class="muted" id="qinfo"></p>
    </footer>
  </div>
  <script src="/vendor/qrcode.js"></script>
  <script src="/tv/boot-qr.js"></script>
  <script src="/tv/boot-play.js"></script>
  <script src="/vendor/canvas-confetti.min.js"></script>
  <script src="/shared/audio/js/bands.js"></script>
  <script src="/tv/fx/js/stage-fx.js"></script>
  <script src="/shared/audio/js/aec.js"></script>
  <script src="/shared/audio/js/rtc-mic.js"></script>
  <script type="module" src="/tv/app.js"></script>
</body>
</html>
