<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>lov-ktv 手机点歌</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="stylesheet" href="/shared/ui/css/tokens.css?v=split1" />
  <link rel="stylesheet" href="/shared/ui/css/base.css?v=split1" />
  <link rel="stylesheet" href="/shared/lyrics/css/lyrics.css?v=split1" />
  <link rel="stylesheet" href="/phone/shell/css/shell.css?v=split4" />
  <link rel="stylesheet" href="/phone/search/css/search.css?v=split5" />
  <link rel="stylesheet" href="/phone/desk/css/desk.css?v=split5" />
  <link rel="stylesheet" href="/phone/player/css/player.css?v=split3" />
  <link rel="stylesheet" href="/phone/sheets/css/sheets.css?v=split1" />
</head>
<body class="phone">
  <div class="app">
    <header class="topbar">
      <button type="button" class="nav-chip" id="topRoom" aria-label="进房">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.8L12 4l8 6.8V20a1 1 0 01-1 1h-5.2v-6.2H10.2V21H5a1 1 0 01-1-1v-9.2z"/></svg>
        <span>进房</span>
      </button>
      <h1 id="topTitle">点歌</h1>
      <button type="button" class="who-mini" id="topWho" aria-label="我的">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 1.8c-4.2 0-7.6 2.1-7.6 4.7V20h15.2v-1.5c0-2.6-3.4-4.7-7.6-4.7z"/></svg>
      </button>
    </header>

    <section class="page page-search" id="page-search" hidden>
      <div class="search-hero">
        <div class="search-row">
          <div class="search-bar">
            <span class="search-ico" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 014.7 9.7l4.6 4.6-1.4 1.4-4.6-4.6A6 6 0 1110 4zm0 2a4 4 0 100 8 4 4 0 000-8z"/></svg>
            </span>
            <input id="q" placeholder="歌名 / 歌手" autocomplete="off" enterkeyhint="search" />
            <button class="search-clear" id="searchClear" type="button" hidden aria-label="清除">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 10.6L6.7 5.3 5.3 6.7 10.6 12l-5.3 5.3 1.4 1.4L12 13.4l5.3 5.3 1.4-1.4L13.4 12l5.3-5.3-1.4-1.4z"/></svg>
            </button>
          </div>
          <button class="search-upload" id="openUpload" type="button" aria-label="本地入库">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l4.2 4.2-1.4 1.4L13 6.8V14h-2V6.8L9.2 8.6 7.8 7.2 12 3zM5 16h14v2H5v-2z"/></svg>
          </button>
          <button class="search-cancel" id="searchCancel" type="button" hidden>取消</button>
        </div>
      </div>
      <audio id="preview" preload="none"></audio>
      <input type="file" id="file" accept="audio/*,video/*" hidden />
      <div class="hits inset-list" id="hits">
        <div class="empty-state">
          <span class="empty-ico" aria-hidden="true"></span>
          <p>搜歌名或歌手</p>
          <span class="tiny">先听再加入曲库</span>
        </div>
      </div>
    </section>

    <section class="page page-desk" id="page-desk">
      <div class="now-bar">
        <div class="now-card" id="nowCard">
          <div class="now-idle">
            <span class="now-cover">♪</span>
            <div><b>还没在唱</b><p class="tiny">从曲库点一首</p></div>
          </div>
        </div>
        <button class="icon-btn ghost" id="nowMore" type="button" aria-label="音量">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4V9zm12.2 1.2a4 4 0 010 3.6l-1.5-.8a2.2 2.2 0 000-2zM18 7.2a7 7 0 010 9.6l-1.4-.9a5.2 5.2 0 000-7.8z"/></svg>
        </button>
      </div>
      <div class="now-tools">
        <button class="now-act" id="skip" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12l8.5-6zm9.5 0h2.5v12h-2.5z"/></svg>
          切歌
        </button>
        <button class="now-act" id="vocalMix" type="button" aria-label="当前伴奏，点按切到原唱">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v10.5a3.5 3.5 0 103.5-3.5H11V8h6V4H9z"/></svg>
          <em id="vocalMixLabel">伴奏</em>
        </button>
        <button class="now-act" id="micToggle" type="button" aria-label="开麦">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zm-7 9a7 7 0 0014 0h-2a5 5 0 01-10 0H5zm6 7.9V22h2v-2.1A8 8 0 0020 12h-2a6 6 0 11-12 0H4a8 8 0 007 7.9z"/></svg>
          <em id="micToggleLabel">开麦</em>
        </button>
      </div>
      <div class="desk-sheet">
        <div class="seg" role="tablist">
          <button type="button" class="seg-btn on" data-desk="queue">已点<em id="queueCount"></em></button>
          <button type="button" class="seg-btn" data-desk="lib">曲库<em id="libCount"></em></button>
        </div>
        <div class="desk-pane inset-list" id="queue">
          <div class="empty-state">
            <span class="empty-ico" aria-hidden="true"></span>
            <p>还没点歌</p>
            <button class="btn primary" type="button" data-go-lib>去曲库加点</button>
          </div>
        </div>
        <div class="desk-pane desk-lib" id="libPane" hidden>
          <div class="lib-tools">
            <div class="lib-search">
              <input id="libQ" placeholder="搜歌名 / 歌星" autocomplete="off" />
            </div>
            <div class="seg seg-sm" role="tablist">
              <button type="button" class="seg-btn on" data-lib-by="all">全部</button>
              <button type="button" class="seg-btn" data-lib-by="title">歌名</button>
              <button type="button" class="seg-btn" data-lib-by="artist">歌星</button>
            </div>
          </div>
          <div class="lib-body">
            <div class="inset-list" id="songs">
              <div class="empty-state">
                <span class="empty-ico" aria-hidden="true"></span>
                <p>曲库还是空的</p>
                <button class="btn primary" type="button" data-go-search>去搜歌</button>
              </div>
            </div>
            <nav class="lib-index" id="libIndex" aria-label="字母索引"></nav>
          </div>
          <div class="lib-pager" id="libPager"></div>
        </div>
      </div>
    </section>

    <section class="page page-player" id="page-player" hidden>
      <div class="player-main" id="playerMain">
        <div class="player-head">
          <button class="icon-btn ghost" id="playerToDesk" type="button" aria-label="返回点歌台">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 6L9 12.4 15.4 18.8l1.4-1.4-5-5 5-5z"/></svg>
          </button>
          <div class="player-titles">
            <b id="playerTitle">还没选歌</b>
            <p class="tiny" id="playerMeta">从点歌台听一首</p>
          </div>
          <button class="icon-btn ghost" id="playerEdit" type="button" aria-label="横屏对齐">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4zm13.2-8.8l1.6 1.6-2.3 2.3 1.2 1.2 2.3-2.3 1.6 1.6V6h-4.4z"/></svg>
          </button>
        </div>
        <audio id="playerAudio" preload="metadata" playsinline crossorigin="anonymous"></audio>
        <audio id="playerGuide" preload="auto" playsinline crossorigin="anonymous" hidden></audio>
        <audio id="phoneIemVoice" autoplay playsinline hidden></audio>
        <div class="player-stage">
          <div class="player-art" id="playerArt">
            <img class="player-cover" id="playerCover" alt="" hidden />
            <div class="player-art-shade"></div>
            <canvas id="playerBands" class="bands player-bands" width="720" height="220"></canvas>
          </div>
          <div class="player-clock">
            <b id="playerNow">0:00</b>
            <input type="range" id="playerSeek" min="0" max="1000" value="0" aria-label="进度" />
            <em id="playerLeft">−0:00</em>
          </div>
        </div>
        <section class="lyrics player-lyrics">
          <div class="prev" id="playerPrev"></div>
          <div class="line" id="playerCur"></div>
          <div class="next" id="playerNext"></div>
        </section>
        <div class="player-body">
          <div class="player-list inset-list" id="playerList"></div>
          <nav class="lib-index" id="playerIndex" aria-label="字母索引"></nav>
        </div>
      </div>
      <div class="player-dock" id="playerKtv">
        <label class="mix-row" id="playerMicRow" hidden>
          <span>麦声</span>
          <input type="range" id="playerMicGain" min="0" max="100" value="80" />
          <em id="playerMicVal">80</em>
        </label>
        <p class="tiny player-hint" id="playerMicHint">戴上耳机。伴奏和人声只在耳机里，不当外放，所以没有回音。</p>
        <div class="player-transport">
          <button class="icon-btn" id="playerMic" type="button" aria-label="开麦唱歌">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zm-7 9a7 7 0 0014 0h-2a5 5 0 01-10 0H5zm6 7.9V22h2v-2.1A8 8 0 0020 12h-2a6 6 0 11-12 0H4a8 8 0 007 7.9z"/></svg>
            <em class="vh" id="playerMicLabel">开麦</em>
          </button>
          <button class="icon-btn on" id="playerIem" type="button" aria-label="耳机耳返">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a7 7 0 00-7 7v4a3 3 0 003 3h1v-6H7a5 5 0 1110 0h-2v6h1a3 3 0 003-3v-4a7 7 0 00-7-7z"/></svg>
          </button>
          <button class="icon-btn on" id="playerVocal" type="button" aria-label="原唱">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 0014 0h-2zm-6 7.9V22h2v-3.1A8 8 0 0020 11h-2a6 6 0 11-12 0H4a8 8 0 007 7.9z"/></svg>
            <em class="vh" id="playerVocalLabel">原唱</em>
          </button>
          <button class="play-btn" id="playerPlay" type="button" aria-label="播放">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn" id="playerNextBtn" type="button" aria-label="下一首">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12l8.5-6zm9.5 0h2.5v12h-2.5z"/></svg>
          </button>
          <button class="icon-btn" id="playerOrder" type="button" aria-label="顺序播放">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10v2H4zm0 5h10v2H4zm0 5h7v2H4zm12.2-1.2L19 18l3.8-3.2-1.2-1.5-1.6 1.3V7h-2v7.6l-1.6-1.3z"/></svg>
            <em class="vh" id="playerOrderLabel">顺序</em>
          </button>
        </div>
      </div>
      <div class="player-align" id="playerAlign" hidden>
        <div class="edit-bar">
          <button class="icon-btn ghost" id="editBack" type="button" aria-label="完成">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          </button>
          <button class="play-btn edit-play" id="editPlay" type="button" aria-label="播放">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="align-now">
            <span class="align-time" id="alignTime"></span>
            <span class="align-text" id="alignText">拖块吸附，松手从这句起播</span>
          </div>
          <button class="icon-btn" id="playerOrderEdit" type="button" aria-label="顺序播放">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10v2H4zm0 5h10v2H4zm0 5h7v2H4zm12.2-1.2L19 18l3.8-3.2-1.2-1.5-1.6 1.3V7h-2v7.6l-1.6-1.3z"/></svg>
          </button>
          <button class="icon-btn" id="playerNextEdit" type="button" aria-label="下一首">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12l8.5-6zm9.5 0h2.5v12h-2.5z"/></svg>
          </button>
          <button class="icon-btn primary" id="saveAlign" type="button" aria-label="保存">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l4 4v14H5V3zm2 2v6h10V5H7zm10 16v-7H7v7h10zM9 6h6v3H9V6z"/></svg>
          </button>
        </div>
        <div class="tl-toolbar">
          <button class="btn tl-icon" id="tlZoomOut" type="button">－</button>
          <button class="btn tl-icon" id="tlZoomIn" type="button">＋</button>
          <button class="btn" id="tlChain" type="button">单句</button>
          <button class="btn" id="nudgeBack" type="button">－0.1s</button>
          <button class="btn" id="nudgeFwd" type="button">＋0.1s</button>
        </div>
        <div class="tl" id="timeline">
          <aside class="tl-heads">
            <div class="tl-head tl-head-ruler"></div>
            <button class="tl-head tl-head-mix" id="tlMixHead" type="button" aria-label="伴奏" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v11.2A3.4 3.4 0 1012.4 12H11V8h6V4H9z"/></svg>
            </button>
            <button class="tl-head tl-head-voice" id="tlVoiceHead" type="button" aria-label="人声" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 0014 0h-2zm-6 7.9V22h2v-3.1A8 8 0 0020 11h-2a6 6 0 11-12 0H4a8 8 0 007 7.9z"/></svg>
            </button>
            <div class="tl-head tl-head-lyrics" aria-label="歌词">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
            </div>
          </aside>
          <div class="tl-viewport">
            <div class="tl-playhead" aria-hidden="true"></div>
            <div class="tl-stage" id="tlStage">
              <div class="tl-ruler" id="tlRuler"></div>
              <canvas class="tl-wave" id="tlWave"></canvas>
              <canvas class="tl-wave tl-voice" id="tlVoiceWave"></canvas>
              <div class="tl-track" id="tlTrack"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <nav class="tabbar" id="tabbar">
      <button type="button" data-nav="desk" class="on">
        <svg class="ico-line" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v11.2A3.4 3.4 0 1012.4 12H11V8h6V4H9z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg class="ico-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v11.2A3.4 3.4 0 1012.4 12H11V8h6V4H9z"/></svg>
        点歌
      </button>
      <button type="button" data-nav="search">
        <svg class="ico-line" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 014.7 9.7l4.6 4.6-1.4 1.4-4.6-4.6A6 6 0 1110 4zm0 2a4 4 0 100 8 4 4 0 000-8z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        <svg class="ico-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 014.7 9.7l4.6 4.6-1.4 1.4-4.6-4.6A6 6 0 1110 4zm0 2a4 4 0 100 8 4 4 0 000-8z"/></svg>
        搜歌
      </button>
      <button type="button" data-nav="player">
        <svg class="ico-line" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <svg class="ico-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        听歌
      </button>
    </nav>

    <div class="overlay" id="roomSheet" hidden>
      <button type="button" class="overlay-backdrop" data-close-sheet="roomSheet" aria-label="关闭"></button>
      <div class="sheet" role="dialog" aria-labelledby="roomSheetTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <h2 id="roomSheetTitle">进入房间</h2>
        <label class="field">
          <span class="tiny">房间码</span>
          <input id="room" placeholder="电视上的 6 位码，空着会新建" inputmode="text" autocomplete="off" />
        </label>
        <button class="btn primary" id="join" type="button">进入房间</button>
        <a class="btn" id="openTv" href="/tv.html" target="lovktv-tv">打开电视</a>
        <p class="tiny" id="roomState">进房后电视唱，手机点歌。</p>
      </div>
    </div>

    <div class="overlay" id="whoSheet" hidden>
      <button type="button" class="overlay-backdrop" data-close-sheet="whoSheet" aria-label="关闭"></button>
      <div class="sheet" role="dialog" aria-labelledby="whoName">
        <div class="sheet-handle" aria-hidden="true"></div>
        <h2>我的</h2>
        <div class="who" id="who">
          <img class="avatar" id="whoAvatar" alt="" hidden />
          <div>
            <b id="whoName">未登录</b>
            <p class="tiny" id="whoHint">微信扫一下就能认号</p>
          </div>
        </div>
        <a class="btn wechat" id="whoLogin" href="/api/auth/scan">认号</a>
        <button class="btn" id="whoLogout" type="button" hidden>退出</button>
      </div>
    </div>

    <div class="overlay" id="mixSheet" hidden>
      <button type="button" class="overlay-backdrop" data-close-sheet="mixSheet" aria-label="关闭"></button>
      <div class="sheet" role="dialog" aria-labelledby="mixSheetTitle">
        <div class="sheet-handle" aria-hidden="true"></div>
        <h2 id="mixSheetTitle">音量</h2>
        <div class="now-mix">
          <label class="mix-row">
            <span id="hostVolLabel">音量</span>
            <input type="range" id="hostVol" min="0" max="100" value="80" />
            <em id="hostVolVal">80</em>
          </label>
          <label class="mix-row" id="micGainRow" hidden>
            <span>麦声</span>
            <input type="range" id="micGain" min="0" max="100" value="80" />
            <em id="micGainVal">80</em>
          </label>
          <p class="tiny" id="micHint"></p>
        </div>
      </div>
    </div>

    <div class="overlay" id="actionSheet" hidden>
      <button type="button" class="overlay-backdrop" id="actionSheetBack" aria-label="取消"></button>
      <div class="action-sheet" role="dialog" aria-labelledby="actionSheetTitle">
        <div class="action-card">
          <h2 id="actionSheetTitle"></h2>
          <p class="tiny" id="actionSheetMsg"></p>
          <div id="actionSheetActs"></div>
        </div>
        <button type="button" class="action-cancel" id="actionSheetCancel">取消</button>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>
  <script src="/shared/audio/js/bands.js?v=wave8"></script>
  <script src="/phone/player/js/timeline.js?v=tl7"></script>
  <script src="/shared/audio/js/rtc-mic.js?v=mic8"></script>
  <script type="module" src="/phone/app.js?v=split7"></script>
</body>
</html>
