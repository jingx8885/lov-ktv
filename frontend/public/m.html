<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>lov-ktv 手机点歌</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0b1020" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="stylesheet" href="/app.css?v=phone28" />
</head>
<body class="phone">
  <div class="app">
    <header class="topbar">
      <button type="button" class="room-chip" id="topRoom">进房</button>
      <h1 id="topTitle">点歌台</h1>
      <button type="button" class="who-mini" id="topWho" aria-label="我的">我</button>
    </header>

    <section class="page" id="page-room" hidden>
      <p class="brand">lov-ktv</p>
      <div class="card who" id="who">
        <img class="avatar" id="whoAvatar" alt="" hidden />
        <div>
          <b id="whoName">未登录</b>
          <p class="tiny" id="whoHint">微信扫一下就能认号</p>
        </div>
        <a class="btn wechat" id="whoLogin" href="/api/auth/scan">认号</a>
        <button class="btn" id="whoLogout" type="button" hidden>退出</button>
      </div>
      <div class="card">
        <label class="tiny">房间码</label>
        <div class="row">
          <input id="room" placeholder="电视上的 6 位码，空着会新建" />
        </div>
        <div class="desk-mix">
          <button class="btn primary" id="join" type="button">进入房间</button>
          <a class="btn" id="openTv" href="/tv.html" target="lovktv-tv">打开电视</a>
        </div>
        <p class="tiny" id="roomState">进房后电视唱，手机点歌。</p>
      </div>
    </section>

    <section class="page page-search" id="page-search" hidden>
      <div class="search-hero">
        <div class="search-bar">
          <span class="search-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 014.7 9.7l4.6 4.6-1.4 1.4-4.6-4.6A6 6 0 1110 4zm0 2a4 4 0 100 8 4 4 0 000-8z"/></svg>
          </span>
          <input id="q" placeholder="歌名 / 歌手" autocomplete="off" enterkeyhint="search" />
          <button class="search-go" id="goSearch" type="button">搜索</button>
        </div>
        <div class="search-meta">
          <p class="search-hint">先找 Karaoke Mugen，华语再走网易。</p>
          <button class="search-upload" id="openUpload" type="button">本地入库</button>
        </div>
      </div>
      <audio id="preview" preload="none"></audio>
      <input type="file" id="file" accept="audio/*,video/*" hidden />
      <div class="hits" id="hits">
        <p class="search-empty">搜歌名或歌手，先听再加入曲库</p>
      </div>
    </section>

    <section class="page page-desk" id="page-desk">
      <div class="now-dock">
        <div class="now-card" id="nowCard"></div>
        <div class="now-tools">
          <button class="icon-btn" id="skip" type="button" aria-label="切歌">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12l8.5-6zm9.5 0h2.5v12h-2.5z"/></svg>
          </button>
          <button class="icon-btn labeled" id="vocalMix" type="button" aria-label="当前伴奏，点按切到原唱">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v10.5a3.5 3.5 0 103.5-3.5H11V8h6V4H9z"/></svg>
            <em id="vocalMixLabel">伴奏</em>
          </button>
          <button class="icon-btn" id="micToggle" type="button" aria-label="开麦">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zm-7 9a7 7 0 0014 0h-2a5 5 0 01-10 0H5zm6 7.9V22h2v-2.1A8 8 0 0020 12h-2a6 6 0 11-12 0H4a8 8 0 007 7.9z"/></svg>
          </button>
        </div>
        <div class="now-mix">
          <label class="mix-row">
            <span id="hostVolLabel">音量</span>
            <input type="range" id="hostVol" min="0" max="100" value="80" />
            <em id="hostVolVal">80</em>
          </label>
          <label class="mix-row" id="micGainRow" hidden>
            <span>麦声</span>
            <input type="range" id="micGain" min="0" max="100" value="80" />
            <em id="micGainVal">80</em>
          </label>
          <p class="tiny" id="micHint"></p>
        </div>
      </div>
      <div class="desk-sheet">
        <div class="desk-tabs" role="tablist">
          <button type="button" class="desk-tab on" data-desk="queue">已点<em id="queueCount"></em></button>
          <button type="button" class="desk-tab" data-desk="lib">曲库<em id="libCount"></em></button>
        </div>
        <div class="desk-pane" id="queue"></div>
        <div class="desk-pane desk-lib" id="libPane" hidden>
          <div class="lib-tools">
            <div class="lib-search">
              <input id="libQ" placeholder="搜歌名 / 歌星" autocomplete="off" />
            </div>
            <div class="lib-by" role="tablist">
              <button type="button" class="lib-by-btn on" data-lib-by="all">全部</button>
              <button type="button" class="lib-by-btn" data-lib-by="title">歌名</button>
              <button type="button" class="lib-by-btn" data-lib-by="artist">歌星</button>
            </div>
            <div class="lib-index" id="libIndex"></div>
          </div>
          <div id="songs"></div>
          <div class="lib-pager" id="libPager"></div>
        </div>
      </div>
    </section>

    <section class="page page-player" id="page-player" hidden>
      <div class="player-main" id="playerMain">
        <div class="player-head">
          <button class="icon-btn ghost" id="playerToDesk" type="button" aria-label="返回点歌台">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 6L9 12.4 15.4 18.8l1.4-1.4-5-5 5-5z"/></svg>
          </button>
          <div class="player-titles">
            <b id="playerTitle">还没选歌</b>
            <p class="tiny" id="playerMeta">从点歌台听一首</p>
          </div>
          <button class="icon-btn ghost" id="playerEdit" type="button" aria-label="横屏对齐">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4zm13.2-8.8l1.6 1.6-2.3 2.3 1.2 1.2 2.3-2.3 1.6 1.6V6h-4.4z"/></svg>
          </button>
        </div>
        <audio id="playerAudio" preload="metadata" playsinline crossorigin="anonymous"></audio>
        <audio id="playerGuide" preload="metadata" playsinline crossorigin="anonymous" hidden></audio>
        <audio id="phoneIemVoice" autoplay playsinline hidden></audio>
        <div class="player-stage">
          <div class="player-art" id="playerArt">
            <img class="player-cover" id="playerCover" alt="" hidden />
            <div class="player-art-shade"></div>
            <canvas id="playerBands" class="bands player-bands" width="720" height="220"></canvas>
          </div>
          <div class="player-clock">
            <b id="playerNow">0:00</b>
            <i class="player-clock-dot" aria-hidden="true"></i>
            <em id="playerLeft">−0:00</em>
          </div>
        </div>
        <section class="lyrics player-lyrics">
          <div class="prev" id="playerPrev"></div>
          <div class="line" id="playerCur"></div>
          <div class="next" id="playerNext"></div>
        </section>
        <div class="player-ktv" id="playerKtv">
          <button class="icon-btn labeled" id="playerMic" type="button" aria-label="开麦唱歌">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zm-7 9a7 7 0 0014 0h-2a5 5 0 01-10 0H5zm6 7.9V22h2v-2.1A8 8 0 0020 12h-2a6 6 0 11-12 0H4a8 8 0 007 7.9z"/></svg>
            <em id="playerMicLabel">开麦</em>
          </button>
          <button class="icon-btn labeled on" id="playerIem" type="button" aria-label="耳机耳返">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a7 7 0 00-7 7v4a3 3 0 003 3h1v-6H7a5 5 0 1110 0h-2v6h1a3 3 0 003-3v-4a7 7 0 00-7-7z"/></svg>
            <em>耳返</em>
          </button>
          <label class="mix-row" id="playerMicRow" hidden>
            <span>麦声</span>
            <input type="range" id="playerMicGain" min="0" max="100" value="80" />
            <em id="playerMicVal">80</em>
          </label>
          <p class="tiny" id="playerMicHint">B方案：戴上耳机。伴奏和人声只在耳机里，不当外放，所以没有回音。</p>
        </div>
        <div class="player-transport">
          <button class="icon-btn labeled on" id="playerVocal" type="button" aria-label="原唱">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 0014 0h-2zm-6 7.9V22h2v-3.1A8 8 0 0020 11h-2a6 6 0 11-12 0H4a8 8 0 007 7.9z"/></svg>
            <em id="playerVocalLabel">原唱</em>
          </button>
          <button class="icon-btn labeled" id="playerOrder" type="button" aria-label="顺序播放">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10v2H4zm0 5h10v2H4zm0 5h7v2H4zm12.2-1.2L19 18l3.8-3.2-1.2-1.5-1.6 1.3V7h-2v7.6l-1.6-1.3z"/></svg>
            <em id="playerOrderLabel">顺序</em>
          </button>
          <button class="play-btn" id="playerPlay" type="button" aria-label="播放">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn labeled" id="playerNextBtn" type="button" aria-label="下一首">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12l8.5-6zm9.5 0h2.5v12h-2.5z"/></svg>
            <em>下一首</em>
          </button>
          <button class="icon-btn labeled" id="playerAlignBtn" type="button" aria-label="横屏对齐">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3zm0 6h12v2H3zm0 6h18v2H3z"/></svg>
            <em>对齐</em>
          </button>
        </div>
        <div class="player-list" id="playerList"></div>
      </div>
      <div class="player-align" id="playerAlign" hidden>
        <div class="edit-bar">
          <button class="icon-btn ghost" id="editBack" type="button" aria-label="完成">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          </button>
          <button class="play-btn edit-play" id="editPlay" type="button" aria-label="播放">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="align-now">
            <span class="align-time" id="alignTime"></span>
            <span class="align-text" id="alignText">拖块吸附，松手从这句起播</span>
          </div>
          <button class="icon-btn" id="playerOrderEdit" type="button" aria-label="顺序播放">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10v2H4zm0 5h10v2H4zm0 5h7v2H4zm12.2-1.2L19 18l3.8-3.2-1.2-1.5-1.6 1.3V7h-2v7.6l-1.6-1.3z"/></svg>
          </button>
          <button class="icon-btn" id="playerNextEdit" type="button" aria-label="下一首">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12l8.5-6zm9.5 0h2.5v12h-2.5z"/></svg>
          </button>
          <button class="icon-btn primary" id="saveAlign" type="button" aria-label="保存">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l4 4v14H5V3zm2 2v6h10V5H7zm10 16v-7H7v7h10zM9 6h6v3H9V6z"/></svg>
          </button>
        </div>
        <div class="tl-toolbar">
          <button class="btn tl-icon" id="tlZoomOut" type="button">－</button>
          <button class="btn tl-icon" id="tlZoomIn" type="button">＋</button>
          <button class="btn" id="tlChain" type="button">单句</button>
          <button class="btn" id="nudgeBack" type="button">－0.1s</button>
          <button class="btn" id="nudgeFwd" type="button">＋0.1s</button>
        </div>
        <div class="tl" id="timeline">
          <aside class="tl-heads">
            <div class="tl-head tl-head-ruler"></div>
            <button class="tl-head tl-head-mix" id="tlMixHead" type="button" aria-label="伴奏" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v11.2A3.4 3.4 0 1012.4 12H11V8h6V4H9z"/></svg>
            </button>
            <button class="tl-head tl-head-voice" id="tlVoiceHead" type="button" aria-label="人声" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 003-3V6a3 3 0 10-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 0014 0h-2zm-6 7.9V22h2v-3.1A8 8 0 0020 11h-2a6 6 0 11-12 0H4a8 8 0 007 7.9z"/></svg>
            </button>
            <div class="tl-head tl-head-lyrics" aria-label="歌词">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
            </div>
          </aside>
          <div class="tl-viewport">
            <div class="tl-playhead" aria-hidden="true"></div>
            <div class="tl-stage" id="tlStage">
              <div class="tl-ruler" id="tlRuler"></div>
              <canvas class="tl-wave" id="tlWave"></canvas>
              <canvas class="tl-wave tl-voice" id="tlVoiceWave"></canvas>
              <div class="tl-track" id="tlTrack"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <nav class="tabbar" id="tabbar">
      <button type="button" data-nav="desk" class="on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v11.2A3.4 3.4 0 1012.4 12H11V8h6V4H9z"/></svg>
        点歌台
      </button>
      <button type="button" data-nav="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 014.7 9.7l4.6 4.6-1.4 1.4-4.6-4.6A6 6 0 1110 4zm0 2a4 4 0 100 8 4 4 0 000-8z"/></svg>
        搜歌
      </button>
      <button type="button" data-nav="player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        播放
      </button>
    </nav>
  </div>
  <script src="/bands.js?v=wave7"></script>
  <script src="/timeline.js?v=tl7"></script>
  <script src="/rtc-mic.js?v=mic8"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const STATUS = {
      queued: "排队",
      fetching: "搜歌下载",
      separating: "人声分离",
      aligning: "按人声对齐歌词",
      annotating: "日语注音",
      composing: "生成 MTV",
      ready: "就绪",
      failed: "失败",
    };
    const params = new URLSearchParams(location.search);
    if (params.get("login")) {
      location.replace("/login.html?" + params.toString());
    }
    $("room").value = (params.get("room") || localStorage.getItem("room") || "").toUpperCase();
    let previewId = "";
    let searchPage = 1;
    const loginQs = () => {
      const q = new URLSearchParams();
      if ($("room").value) q.set("room", $("room").value.trim().toUpperCase());
      q.set("next", location.pathname + location.search);
      return "/api/auth/scan?" + q.toString();
    };

    async function loadWho() {
      const data = await fetch("/api/auth/me", { credentials: "same-origin" }).then((r) => r.json()).catch(() => ({ user: null }));
      const user = data.user;
      $("whoName").textContent = user ? (user.sid || user.nickname || "已登录") : "未登录";
      $("whoHint").textContent = user ? (user.wechat ? "微信 ID 已锁定" : "本机 ID") : "微信扫一下就能认号";
      $("whoLogin").hidden = !!user;
      $("whoLogin").href = loginQs();
      $("whoLogout").hidden = !user;
      if (user && user.avatar) {
        $("whoAvatar").hidden = false;
        $("whoAvatar").src = user.avatar;
        $("topWho").innerHTML = `<img alt="" src="${user.avatar}">`;
      } else {
        $("whoAvatar").hidden = true;
        $("topWho").textContent = user ? (user.sid || "我").slice(0, 2) : "我";
      }
    }
    $("whoLogout").onclick = async () => {
      await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" });
      loadWho();
    };
    loadWho();

    const PAGES = ["room", "search", "desk", "player"];
    const PAGE_TITLE = { room: "房间", search: "搜歌", desk: "点歌台", player: "播放" };
    const ICO = {
      play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
      listen: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 0114 0v6a2 2 0 01-2 2h-2v-7h3a6 6 0 00-12 0h3v7H7a2 2 0 01-2-2v-6z"/></svg>',
      plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>',
      trash: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h5v2H3V5h5l1-2zm1 6h2v9h-2V9zm4 0h2v9h-2V9zM8 9h2v9H8V9z"/></svg>',
      save: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l4 4v14H5V3zm2 2v6h10V5H7zm10 16v-7H7v7h10zM9 6h6v3H9V6z"/></svg>',
      seq: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10v2H4zm0 5h10v2H4zm0 5h7v2H4zm12.2-1.2L19 18l3.8-3.2-1.2-1.5-1.6 1.3V7h-2v7.6l-1.6-1.3z"/></svg>',
      shuffle: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3h4v4h-2V6.4l-3.2 3.2-1.4-1.4L17.6 5H17V3zM3 7h6.6l7 7H21v2h-5.6l-7-7H3V7zm14 8.6l3.2 3.2V17h2v4h-4v-2h1.6L14.6 15l1.4-1.4 1 1zM3 15h4.6l2.2-2.2 1.4 1.4L8.4 17H3v-2z"/></svg>',
    };
    function setPlayIcon(playing) {
      const icon = playing ? ICO.pause : ICO.play;
      const label = playing ? "暂停" : "播放";
      ["playerPlay", "editPlay"].forEach((id) => {
        const btn = $(id);
        if (!btn) return;
        btn.innerHTML = icon;
        btn.setAttribute("aria-label", label);
      });
    }
    function togglePlayer() {
      if (!playerSong) return alert("先从点歌台听一首");
      const audio = $("playerAudio");
      hookPlayerAudio();
      if (audio.paused) {
        audio.play().catch(() => alert("点一下播放，手机才允许出声"));
        setPlayIcon(true);
        syncGuide();
      } else {
        audio.pause();
        setPlayIcon(false);
        syncGuide();
      }
    }
    function playFromMs(ms) {
      if (!playerSong) return;
      const audio = $("playerAudio");
      const start = () => {
        hookPlayerAudio();
        try { audio.currentTime = Math.max(0, ms) / 1000; } catch (err) {}
        syncGuide(Math.max(0, ms) / 1000);
        audio.play().then(() => setPlayIcon(true)).catch(() => setPlayIcon(false));
        if (!playerRaf) playerRaf = requestAnimationFrame(paintPlayer);
      };
      if (audio.readyState >= 1) start();
      else audio.addEventListener("loadedmetadata", start, { once: true });
    }
    let currentPage = "desk";
    function syncEditAxis() {
      const rotated = document.body.classList.contains("edit-on") && window.matchMedia("(orientation: portrait)").matches;
      const tl = $("timeline");
      if (tl) tl.dataset.axis = rotated ? "y" : "x";
    }
    function exitEdit() {
      document.body.classList.remove("edit-on");
      $("playerAlign").hidden = true;
      $("playerAudio").muted = false;
      try { screen.orientation.unlock(); } catch (err) {}
      syncEditAxis();
      syncGuide();
    }
    function enterEdit() {
      if (!playerSong) return alert("先从点歌台听一首");
      $("playerAlign").hidden = false;
      document.body.classList.add("edit-on");
      mixTrackOn = false;
      voiceTrackOn = true;
      applyEditorTracks();
      syncEditAxis();
      try { screen.orientation.lock("landscape"); } catch (err) {}
      setPlayIcon(!$("playerAudio").paused);
      syncGuide();
      requestAnimationFrame(() => {
        ensureTimeline().render();
        applyEditorTracks();
      });
    }
    function showPage(name, songId, push) {
      if (name === "upload") name = "search";
      if (!PAGES.includes(name)) name = $("room").value ? "desk" : "room";
      if (name !== "player") {
        exitEdit();
        pausePlayer();
      }
      currentPage = name;
      document.body.dataset.page = name;
      PAGES.forEach((id) => { $("page-" + id).hidden = id !== name; });
      document.querySelectorAll("[data-nav]").forEach((b) => b.classList.toggle("on", b.dataset.nav === name));
      $("topTitle").textContent = PAGE_TITLE[name] || "点歌台";
      $("topRoom").textContent = ($("room").value || "进房").slice(0, 8);
      if (push !== false) {
        const url = new URL(location.href);
        url.hash = name;
        history.pushState({ page: name }, "", url);
      }
      if (name === "desk") {
        loadSongs();
        loadRoom();
      }

    function previewParams(hit) {
      const params = new URLSearchParams({ title: hit.title || "", artist: hit.artist || "" });
      if (hit.media) params.set("media", hit.media);
      return params;

    async function togglePreview(hit, btn) {
      if (previewId === hit.id) {
        stopPreview();
        return;
      }
      stopPreview();
      btn.textContent = "…";
      btn.classList.add("busy");
      const params = previewParams(hit);
      const infoRes = await fetch(`/api/preview/${encodeURIComponent(hit.id)}/resolve?` + params.toString());
      const info = await infoRes.json().catch(() => ({}));
      if (!infoRes.ok) {
        btn.textContent = "试听";
        btn.classList.remove("busy");
        alert(info.detail || "这首暂时不能试听，换一条再听");
        return;
      }
      previewId = hit.id;
      btn.textContent = "停止";
      btn.classList.add("on");
      btn.classList.remove("busy");
      const audio = $("preview");
      audio.src = `/api/preview/${encodeURIComponent(hit.id)}?` + params.toString();
      audio.play().catch(() => {
        stopPreview();
        alert("这首暂时不能试听，换一条再听");
      });
      audio.onended = stopPreview;
    }

    async function runSearch(page) {

      stopPreview();
      $("hits").innerHTML = "<p class='search-empty'>搜索中…</p>";
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&page=${searchPage}&count=10`);
      const data = await res.json();
      if (!res.ok) {
        $("hits").innerHTML = `<p class="search-empty">${data.detail || "搜索失败"}</p>`;
        return;
      }
      const hits = data.hits || [];
      const cards = hits.map((hit) => {
        const mugen = hit.source === "mugen";
        const source = mugen ? "Karaoke Mugen" : "网易";
        const tags = [
          hit.lyrics_ready ? "成品歌词" : "",
          hit.off_vocal ? "无原唱/伴奏" : (hit.clean ? "" : "可能是伴奏/翻唱"),
          hit.album || "",
        ].filter(Boolean);
        const canPreview = !!(hit.preview_url || mugen);
        return `
        <article class="hit-card">
          <span class="hit-cover ${mugen ? "mugen" : ""}">${escapeHtml(songInitial(hit.title))}</span>
          <div class="hit-copy">

            </div>
          </div>
          <div class="hit-actions">
            ${canPreview ? `<button type="button" class="hit-btn" data-preview="${escapeHtml(hit.id)}">试听</button>` : ""}
            <button type="button" class="hit-btn primary" data-import='${JSON.stringify(hit)}'>加入曲库</button>
          </div>
        </article>`;
      }).join("") || "<p class='search-empty'>没有这首，换个关键字再搜</p>";
      const canPrev = searchPage > 1;
      const canNext = !!data.has_more && hits.length > 0;
      const pager = hits.length ? `
        <div class="pager">
          <button type="button" class="hit-btn" data-page="${searchPage - 1}" ${canPrev ? "" : "disabled"}>上一页</button>

        </div>` : "";
      $("hits").innerHTML = cards + pager;

      if (!ids.length) return;
      const cur = playerSong && playerSong.id;
      let next = ids[0];
      if (playOrder === "shuffle") {
        const pool = ids.filter((id) => id !== cur);
        const src = pool.length ? pool : ids;
        next = src[Math.floor(Math.random() * src.length)];
      } else {
        const index = Math.max(0, ids.indexOf(cur));
        next = ids[(index + 1) % ids.length];

      loadPlayerSong(next, { play: true });

    function escapeHtml(text) {
      return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    function fmtClock(ms) {
      const n = Math.max(0, Math.floor((ms || 0) / 1000));
      return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")}`;

      const cover = $("playerCover");
      art.classList.remove("has-cover");

      if (!song || !song.id) return;
      cover.onload = () => {
        cover.hidden = false;
        art.classList.add("has-cover");
      };
      cover.onerror = () => {
        cover.hidden = true;
        cover.removeAttribute("src");
        art.classList.remove("has-cover");
      };
      cover.src = mediaUrl(song.id, "cover.jpg");

    function fmtMs(ms) {
      const n = Math.max(0, Math.floor(ms || 0));
      const m = Math.floor(n / 60000);

      $("micGainRow").hidden = !live;
      if (!live && !room.mic_on) {
        if (!$("micHint").dataset.hold) $("micHint").textContent = "";
      } else if (live) {
        $("micHint").textContent = room.mic_on ? "麦已接到电视" : "正在把麦接到电视…";
      }
    }
    function postMix(body) {
      const code = $("room").value.trim().toUpperCase();
      if (!code) return;
      return fetch(`/api/rooms/${code}/mix`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then((r) => r.json()).then((room) => {
        paintMix(room);
        return room;
      }).catch(() => {});
    }
    function bindMixSlider(id, key) {
      const el = $(id);
      const slide = () => {
        $(id === "hostVol" ? "hostVolVal" : "micGainVal").textContent = el.value;
        clearTimeout(mixTimer);
        mixTimer = setTimeout(() => postMix({ [key]: Number(el.value) }), 80);
      };
      el.addEventListener("input", slide);
      el.addEventListener("change", () => postMix({ [key]: Number(el.value) }));
    }
    bindMixSlider("hostVol", "volume");
    bindMixSlider("micGain", "mic_gain");
    function connectRoomRtc(code) {
      code = String(code || "").trim().toUpperCase();
      if (!code || !window.LovMic) return;
      if (roomRtc && roomRtcCode === code) return;
      if (roomRtc) {
        roomRtc.stopMic().catch(() => {});
        roomRtc.disconnect();
      }
      roomRtcCode = code;
      roomRtc = LovMic.create({ role: "phone" });
      roomRtc.connect(code, {
        onSnapshot: (room) => paintMix(room),
        onPeer: (msg) => {
          if (msg.event === "join" && msg.role === "tv" && roomRtc.isLive()) {
            roomRtc.makeOffer().catch(() => {});
          }
        },
        onRtc: (msg) => {
          if (msg.kind === "answer") roomRtc.handleAnswer(msg);
          else if (msg.kind === "ice") roomRtc.addIce(msg);
        },
        onState: (state) => {
          if (!roomRtc.isLive()) return;
          if (state === "connected") $("micHint").textContent = "麦已接到电视";
          else if (state === "failed") $("micHint").textContent = "电视没接上，再点一次开麦";
        },
      });
    }
    $("micToggle").onclick = async () => {
      const code = $("room").value.trim().toUpperCase();
      if (!code) return alert("先填房间码并点进入");
      connectRoomRtc(code);
      const btn = $("micToggle");
      btn.disabled = true;
      $("micHint").dataset.hold = "1";
      try {
        if (roomRtc && roomRtc.isLive()) {
          await roomRtc.stopMic();
          $("micHint").textContent = "";
        } else {
          if (typeof stopPhoneMic === "function") stopPhoneMic();
          $("micHint").textContent = "请允许使用麦克风";
          await roomRtc.startMic();
          $("micHint").textContent = "麦已打开，声音会从电视出来";
        }
      } catch (err) {
        $("micHint").textContent = LovMic.micErrorText(err);
      } finally {
        delete $("micHint").dataset.hold;
        btn.disabled = false;
        const live = !!(roomRtc && roomRtc.isLive());
        btn.classList.toggle("live", live);
        btn.classList.toggle("on", live);
        $("micGainRow").hidden = !live;
        btn.setAttribute("aria-label", live ? "关麦" : "开麦");
      }
    };

    $("openUpload").onclick = () => $("file").click();
    $("file").onchange = async () => {
      const file = $("file").files[0];
      if (!file) return;
      const btn = $("openUpload");
      btn.disabled = true;
      try {
        const fd = new FormData();
        fd.append("file", file);
        fd.append("title", file.name);
        fd.append("lyrics", "");
        const res = await fetch("/api/songs", { method: "POST", body: fd });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "上传失败");
        $("file").value = "";
        showPage("desk");
      } catch (err) {
        alert(err.message || "上传失败");
      } finally {
        btn.disabled = false;
      }
    };

    let phoneMic = null;
    let phoneMicSrc = null;
    let phoneMicGain = null;
    let phoneCtx = null;
    let phoneMicLevel = Number(localStorage.getItem("phoneMicGain") || 80);
    let phoneIem = localStorage.getItem("phoneIem") !== "0";
    function phoneMicHintIdle() {
      return phoneIem
        ? "戴有线耳机。耳返会关掉回声消除，自己的声音才会快。蓝牙耳机会再慢一截。"
        : "本机唱歌，伴奏和人声一起从手机喇叭出来。回音大就打开耳返。";
    }
    function ensurePhoneCtx() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (phoneCtx && phoneCtx.state !== "closed") return phoneCtx;
      if (playerHook && playerHook.ctx && playerHook.ctx.state !== "closed") {
        phoneCtx = playerHook.ctx;
        return phoneCtx;
      }
      phoneCtx = new AC({ latencyHint: "interactive" });
      return phoneCtx;
    }
    function phoneMicAudioConstraints() {
      if (phoneIem) {
        return [
          { echoCancellation: false, noiseSuppression: false, autoGainControl: false, latency: 0.01, channelCount: 1 },
          { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
        ];
      }
      return [{ echoCancellation: true, noiseSuppression: true, autoGainControl: true }];
    }
    async function acquirePhoneMic() {
      let last = null;
      for (const audio of phoneMicAudioConstraints()) {
        try {
          return await navigator.mediaDevices.getUserMedia({ audio, video: false });
        } catch (err) {
          last = err;
        }
      }
      throw last || new Error("开麦失败");
    }
    function disconnectPhoneMicGraph() {
      if (phoneMicSrc) try { phoneMicSrc.disconnect(); } catch (err) {}
      if (phoneMicGain) try { phoneMicGain.disconnect(); } catch (err) {}
      phoneMicSrc = phoneMicGain = null;
      const el = $("phoneIemVoice");
      if (el) {
        el.pause();
        el.srcObject = null;
      }
    }
    function applyPhoneMonitor() {
      disconnectPhoneMicGraph();
      if (!phoneMic) return;
      const el = $("phoneIemVoice");
      if (phoneIem && el) {
        el.srcObject = phoneMic;
        el.muted = false;
        el.volume = Math.max(0, Math.min(1, phoneMicLevel / 100));
        el.play().catch(() => {});
        return;
      }
      if (!phoneCtx) return;
      phoneMicSrc = phoneCtx.createMediaStreamSource(phoneMic);
      phoneMicGain = phoneCtx.createGain();
      phoneMicGain.gain.value = phoneMicLevel / 100;
      phoneMicSrc.connect(phoneMicGain);
      phoneMicGain.connect(phoneCtx.destination);
    }
    function paintPhoneMic() {
      const on = !!(phoneMic && phoneMic.getTracks().some((track) => track.readyState === "live"));
      $("playerMic").classList.toggle("on", on);
      $("playerMic").classList.toggle("live", on);
      $("playerMic").setAttribute("aria-label", on ? "关麦" : "开麦唱歌");
      $("playerMicLabel").textContent = on ? "开麦中" : "开麦";
      $("playerMicRow").hidden = !on;
      $("playerKtv").classList.toggle("live", on);
      $("playerIem").classList.toggle("on", phoneIem);
      $("playerIem").setAttribute("aria-pressed", phoneIem ? "true" : "false");
      $("playerArt").classList.toggle("is-sing", on);
      if (!on && !$("playerMicHint").dataset.hold) {
        $("playerMicHint").textContent = phoneMicHintIdle();
      }
    }
    function setPhoneMicGain(value) {
      phoneMicLevel = Math.max(0, Math.min(100, Number(value) || 0));
      localStorage.setItem("phoneMicGain", String(phoneMicLevel));
      $("playerMicGain").value = String(phoneMicLevel);
      $("playerMicVal").textContent = String(phoneMicLevel);
      if (phoneMicGain) phoneMicGain.gain.value = phoneMicLevel / 100;
      const el = $("phoneIemVoice");
      if (el) el.volume = Math.max(0, Math.min(1, phoneMicLevel / 100));
    }
    function stopPhoneMic() {
      disconnectPhoneMicGraph();
      if (phoneMic) {
        phoneMic.getTracks().forEach((track) => track.stop());
        phoneMic = null;
      }
      paintPhoneMic();
    }
    async function headphoneState() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return { kind: "unknown", sink: "" };
      const devices = await navigator.mediaDevices.enumerateDevices().catch(() => []);
      const outs = devices.filter((item) => item.kind === "audiooutput");
      const hp = outs.find((item) => /headphone|headset|airpod|earbud|earphone|usb audio|lightning|耳机|耳麦/i.test(item.label || ""));
      if (hp) return { kind: "headphones", sink: hp.deviceId || "" };
      const text = outs.map((item) => item.label || "").join(" ").toLowerCase();
      if (outs.length && /speaker|扬声器/.test(text) && !/head|ear|耳机/.test(text)) {
        return { kind: "speaker", sink: "" };
      }
      return { kind: "unknown", sink: "" };
    }
    async function routePhoneSink(sink) {
      if (!sink) return false;
      const audio = $("playerAudio");
      const guide = $("playerGuide");
      try {
        if (audio && audio.setSinkId) await audio.setSinkId(sink);
        if (guide && guide.setSinkId) await guide.setSinkId(sink);
        const iem = $("phoneIemVoice");
        if (iem && iem.setSinkId) await iem.setSinkId(sink);
        if (phoneCtx && phoneCtx.setSinkId) await phoneCtx.setSinkId(sink);
        return true;
      } catch (err) {
        return false;
      }
    }
    async function startPhoneMic(opts) {
      const restart = !!(opts && opts.restart);
      if (!restart && roomRtc && roomRtc.isLive()) {
        await roomRtc.stopMic();
        $("micHint").textContent = "";
        $("micToggle").classList.remove("live", "on");
        $("micGainRow").hidden = true;
      }
      const jack = await headphoneState();
      if (!restart && phoneIem && jack.kind === "speaker") {
        const go = confirm("耳返请先戴上耳机。喇叭外放会把伴奏灌回麦克风。还没戴也要开麦？");
        if (!go) throw new Error("先戴上耳机再开麦");
      }
      hookPlayerAudio();
      phoneCtx = ensurePhoneCtx();
      if (phoneCtx && phoneCtx.state === "suspended") await phoneCtx.resume();
      if (phoneMic) {
        phoneMic.getTracks().forEach((track) => track.stop());
        phoneMic = null;
      }
      disconnectPhoneMicGraph();
      phoneMic = await acquirePhoneMic();
      applyPhoneMonitor();
      if (phoneIem && jack.sink) await routePhoneSink(jack.sink);
      if (!restart && playerVocal && playerSong) $("playerVocal").click();
      paintPhoneMic();
      if (phoneIem && jack.kind === "headphones") {
        $("playerMicHint").textContent = "耳返已开：回声消除已关，有线耳机听自己会快很多。麦声拉到 0 就只听伴奏";
      } else if (phoneIem) {
        $("playerMicHint").textContent = "耳返已开。请用有线耳机；蓝牙还会慢一截。麦声拉到 0 就只听伴奏";
      } else {
        $("playerMicHint").textContent = "麦已打开，人声和伴奏从这只手机出来";
      }
    }
    $("playerIem").onclick = async () => {
      phoneIem = !phoneIem;
      localStorage.setItem("phoneIem", phoneIem ? "1" : "0");
      paintPhoneMic();
      if (!phoneMic) return;
      $("playerMicHint").dataset.hold = "1";
      try {
        await startPhoneMic({ restart: true });
      } catch (err) {
        stopPhoneMic();
        $("playerMicHint").textContent = (err && err.message) || "耳返切换失败";
      } finally {
        delete $("playerMicHint").dataset.hold;
        paintPhoneMic();
      }
    };
    paintPhoneMic();
    $("playerMicGain").value = String(phoneMicLevel);
    $("playerMicVal").textContent = String(phoneMicLevel);
    $("playerMicGain").oninput = () => setPhoneMicGain($("playerMicGain").value);
    $("playerMic").onclick = async () => {
      const btn = $("playerMic");
      btn.disabled = true;
      $("playerMicHint").dataset.hold = "1";
      try {
        if (phoneMic) {
          stopPhoneMic();
          $("playerMicHint").textContent = phoneMicHintIdle();
        } else {
          $("playerMicHint").textContent = phoneIem ? "戴上耳机，并允许使用麦克风" : "请允许使用麦克风";
          await startPhoneMic();
        }
      } catch (err) {
        stopPhoneMic();
        $("playerMicHint").textContent = (window.LovMic && LovMic.micErrorText(err)) || (err && err.message) || "开麦失败";
      } finally {
        delete $("playerMicHint").dataset.hold;
        btn.disabled = false;
        paintPhoneMic();
      }
    };
    $("playerEdit").onclick = () => enterEdit();
    $("playerVocal").classList.toggle("on", !!playerVocal);
    $("playerVocalLabel").textContent = playerVocal ? "原唱" : "伴奏";
    $("playerVocal").setAttribute("aria-label", playerVocal ? "当前原唱，点按切到伴奏" : "当前伴奏，点按切到原唱");
    $("playerOrder").onclick = () => togglePlayOrder();
    $("playerOrderEdit").onclick = () => togglePlayOrder();
    $("playerNextBtn").onclick = () => playNextSong();
    $("playerNextEdit").onclick = () => playNextSong();
    updatePlayOrderBtns();
    $("playerAlignBtn").onclick = () => enterEdit();
    $("playerToDesk").onclick = () => showPage("desk");
    $("editBack").onclick = () => exitEdit();

    setInterval(() => {
      if (!$("page-desk").hidden) {
        loadRoom();
        loadSongs();
      }
    }, 2000);

    const bootPage = (location.hash || "").replace("#", "") || ($("room").value ? "desk" : "room");
    showPage(bootPage, null, false);
  </script>
</body>
</html>
