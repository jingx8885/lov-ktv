name: LovKTV
options:
  bundleIdPrefix: com.lovktv
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  LovKTV:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LovKTV
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LovKTV 遥控
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.lovktv.phone
            CFBundleURLSchemes:
              - lovktv
        NSCameraUsageDescription: 扫码二维码可以快速填入服务器地址和房间码
        NSLocalNetworkUsageDescription: 连接局域网里的 KTV 服务器时需要访问本地网络
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lovktv.phone
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
    entitlements:
      path: LovKTV/LovKTV.entitlements
    dependencies:
      - package: GoogleSignIn
  LovKTVTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - LovKTVTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LovKTV
schemes:
  LovKTV:
    build:
      targets:
        LovKTV: all
        LovKTVTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LovKTVTests
