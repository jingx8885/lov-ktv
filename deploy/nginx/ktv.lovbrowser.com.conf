# ktv.lovbrowser.com → 127.0.0.1:8790 (lov-ktv)
# Install to /etc/nginx/sites-available/ and enable.

map $http_upgrade $lovktv_conn_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ktv.lovbrowser.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ktv.lovbrowser.com;

    access_log /var/log/nginx/ktv.lovbrowser.access.log;
    error_log  /var/log/nginx/ktv.lovbrowser.error.log warn;

    client_max_body_size 80m;

    # Same origin cert as lovbrowser.com / stock.lovbrowser.com.
    # Browsers see Cloudflare's *.lovbrowser.com; this is the CF-to-origin hop.
    ssl_certificate     /etc/ssl/lovbrowser/lovbrowser.com.pem;
    ssl_certificate_key /etc/ssl/lovbrowser/lovbrowser.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lovktv_conn_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
