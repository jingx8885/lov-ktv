    - paragraph [ref=e61]: What you actually use on stage
    - heading "Every step is a button. The room wires them together." [level=2] [ref=e62]
    - generic [ref=e63]:
      - article [ref=e64]:
        - paragraph [ref=e65]: Search
        - heading "Search a title — don’t upload first" [level=3] [ref=e66]
        - paragraph [ref=e67]: Titles go into the library. NetEase links, then SoundCloud, then YouTube. Upload is only a fallback.
      - article [ref=e68]:
        - paragraph [ref=e69]: Split
        - heading "Vocal split without Torch" [level=3] [ref=e70]
        - paragraph [ref=e71]: onnxruntime splits the track on the spot. Results cache on the box, so you can still sing if the processor drops.
      - article [ref=e72]:
        - paragraph [ref=e73]: Color
        - 'heading "Three color grammars: ZH, JA, EN" [level=3] [ref=e74]'
        - paragraph [ref=e75]: Current line plus the next. Japanese readings sit on the characters. ASS / LRC / JSON stay as sidecar captions — not burned in.
      - article [ref=e76]:
        - paragraph [ref=e77]: Room
        - heading "No app — scan in and you’re in the room" [level=3] [ref=e78]
        - paragraph [ref=e79]: TV shows a code; the phone is the queue desk. Queue, bump, skip — whoever arrives can pick.
      - article [ref=e80]:
        - paragraph [ref=e81]: Box
        - heading "Android TV hosts the LAN" [level=3] [ref=e82]
        - paragraph [ref=e83]: Install on the box and open a room. Finished tracks cache locally so a living-room outage still finishes the night.
      - article [ref=e84]:
        - paragraph [ref=e85]: Mic
        - heading "Phone mic can mix onto the TV" [level=3] [ref=e86]
        - paragraph [ref=e87]: Volume sliders run the room. WeChat IDs are optional — sing with a device identity if it is not set up.
