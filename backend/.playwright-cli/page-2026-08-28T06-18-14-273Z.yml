  - generic [ref=e153]:
    - paragraph [ref=e154]: Questions before you go on
    - heading "Clear the usual snags first." [level=2] [ref=e155]
    - generic [ref=e156]:
      - generic [ref=e157]:
        - term [ref=e158]: Do I need an Android TV?
        - definition [ref=e159]: No. Open the TV page in a browser and sing. Android TV just puts the host and cache in a box.
      - generic [ref=e160]:
        - term [ref=e161]: Where do songs come from?
        - definition [ref=e162]: "Search by title: NetEase links, then SoundCloud, then YouTube. For your room only — no redistribution."
      - generic [ref=e163]:
        - term [ref=e164]: What if there is no official lyric?
        - definition [ref=e165]: Paste lyrics. If still none, we transcribe. Official LRC wins when it exists.
      - generic [ref=e166]:
        - term [ref=e167]: Do I install Torch locally?
        - definition [ref=e168]: No. Vocal split is ONNX. Models are already baked into the image.
      - generic [ref=e169]:
        - term [ref=e170]: Can I sing offline?
        - definition [ref=e171]: Yes for songs already processed and cached on the box. New songs still need the processor online.
      - generic [ref=e172]:
        - term [ref=e173]: Can this be a public catalog site?
        - definition [ref=e174]: No. This is home / private-room self-hosting. Do not publish media files.
