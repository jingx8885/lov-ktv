[project]
name = "lovktv"
version = "0.1.0"
description = "lov-ktv server: search/download, vocal split, karaoke rooms"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx[socks]>=0.27",
  "pillow>=10.0",
  "pykakasi>=2.3",
  "numpy>=1.26",
  "soundfile>=0.12",
  "onnxruntime>=1.18",
  "psycopg[binary]>=3.2",
  "lyric-align>=0.3",
  "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=2.12.0"]
sep = ["audio-separator>=0.30"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lovktv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
