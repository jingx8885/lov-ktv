[project]
name = "lovktv"
version = "0.1.0"
description = "lov-ktv server: search/download, vocal split, karaoke rooms"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx[socks]>=0.27",
  "httpx2>=2.0",
  "pillow>=10.0",
  "pykakasi>=2.3",
  "numpy>=1.26",
  "soundfile>=0.12",
  "onnxruntime>=1.18",
  "psycopg[binary]>=3.2",
  "lyric-align>=0.3",
  "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=2.12.0", "ruff>=0.16.5", "pyright>=1.1.403"]
sep = ["audio-separator>=0.30"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lovktv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"lovktv/pipeline/lyric_anchor.py" = ["E402"]
"scripts/manual_align.py" = ["E402"]
"lovktv/catalog/fetch.py" = ["F401"]

[tool.pyright]
# Keep the gate focused on the typed contracts and alignment pipeline.  The
# catalog/HTTP compatibility facades intentionally use dynamic re-exports and
# are covered by the runtime test suite instead.
include = [
  "lovktv/contracts.py",
  "lovktv/room_contract.py",
  "lovktv/timeline_contract.py",
  "lovktv/pipeline/audio.py",
  "lovktv/pipeline/align.py",
  "lovktv/pipeline/bounds.py",
  "lovktv/pipeline/clock.py",
  "lovktv/pipeline/constants.py",
  "lovktv/pipeline/energy.py",
  "lovktv/pipeline/lyrics.py",
  "lovktv/pipeline/matching.py",
  "scripts",
]
exclude = ["tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
